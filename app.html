<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anleitung</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5bd3">
  <meta name="apple-mobile-web-app-title" content="Web-Apps">
  <link rel="stylesheet" href="style.css">
  <style>
    .appvideo { margin: 22px 0 6px; display: flex; flex-direction: column; gap: 10px; }
    .appvideo video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 14px; background: #0b0f14; }
    .appvideo .actions { align-items: center; }
    .appvideo .hint { color: var(--muted); font-size: 15px; }
    .upd { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
    .appvideo .vtitel { margin: 0; font-size: 20px; }
  </style>
  <script src="theme.js"></script>
<!-- Aufrufe zählen: GoatCounter (datenschutzfreundlich, ohne Cookies) – Zähler auf der Übersicht -->
<script data-goatcounter="https://pati2018.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <main class="wrap">
    <a class="back" href="./">← Alle Apps</a>
    <div id="inhalt"><p class="empty">Lade …</p></div>
  </main>
  <footer class="site wrap"><a href="./">Zurück zur Übersicht</a></footer>

  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script>document.write('<script src="apps.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ALIAS = { gitarre: "smart-instruments", klavier: "smart-instruments" };   // alte Links führen zur neuen Anleitung
    const raw = new URLSearchParams(location.search).get("id"), id = ALIAS[raw] || raw;
    const app = (window.APPS || []).find(a => a.id === id);
    const box = document.getElementById("inhalt");
    /* Englische Anleitung: app.html?id=…&lang=en, wenn die App in apps.js „en“ hat (Datei anleitungen/<id>-en.md) */
    const EN = new URLSearchParams(location.search).get("lang") === "en" && !!(app && app.en);
    const T = EN ? { open: "Open app", guide: "Guide", load: "Loading guide …", none: "There is no guide for this app yet.", dl: "⬇ Download video", hint: "on the iPad: open the video → Share → “Save Video”", all: "← All apps", back: "Back to the overview", other: "🌐 Deutsche Anleitung" }
                 : { open: "App öffnen", guide: "Anleitung", load: "Lade Anleitung …", none: "Für diese App gibt es noch keine ausführliche Anleitung.", dl: "⬇ Video herunterladen", hint: "am iPad: Video öffnen → Teilen → „Video sichern“", all: "← Alle Apps", back: "Zurück zur Übersicht", other: "🌐 English guide" };
    if (EN) { document.documentElement.lang = "en"; document.querySelector("a.back").textContent = T.all; document.querySelector("footer.site a").textContent = T.back; }

    if (!app) {
      box.innerHTML = `<p class="empty">Diese App gibt es nicht. <a href="./">Zur Übersicht</a></p>`;
    } else {
      document.title = `${app.titel} – ${T.guide}`;
      box.innerHTML = `
        <div class="app-head">
          ${app.bild ? `<div class="icon" aria-hidden="true" style="background:none;overflow:hidden"><img src="${esc(app.bild)}" alt="" style="width:100%;height:100%;border-radius:inherit"></div>` : `<div class="icon" aria-hidden="true"${[...(app.symbol || "")].length > 1 ? ' style="font-size:24px;letter-spacing:-2px"' : ""}>${esc(app.symbol || "🧩")}</div>`}
          <h1>${esc(app.titel)}</h1>
        </div>
        ${app.update ? `<p class="upd">${EN ? "Last update" : "Letztes Update"}: <b>${esc(new Date(app.update).toLocaleDateString(EN ? "en-GB" : "de-DE", { day: "numeric", month: "long", year: "numeric" }))}</b>${app.version ? ` · Version <b>${esc(app.version)}</b>` : ""}${app.neu && !EN ? ` · Neu: ${esc(app.neu)}` : ""}</p>` : ""}
        <p class="lead">${esc(EN ? app.en.kurz : app.kurz)}</p>
        <div class="actions">
          ${(app.links || [{ label: T.open, url: app.link }]).map(l => `<a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}
          ${app.en ? `<a class="btn" href="app.html?id=${encodeURIComponent(app.id)}${EN ? "" : "&lang=en"}" lang="${EN ? "de" : "en"}">${T.other}</a>` : ""}
        </div>
        ${[].concat(app.video || []).sort((a, b) => EN ? (/english/i.test(b.titel || "") - /english/i.test(a.titel || "")) : 0).map(v => `<section class="appvideo" aria-label="${esc(v.titel || "Video")}">
          ${v.titel ? `<h2 class="vtitel">${esc(v.titel)}</h2>` : ""}
          <video controls playsinline preload="none"${v.bild ? ` poster="${esc(v.bild)}"` : ""}><source src="${esc(v.src)}" type="video/mp4"></video>
          <div class="actions"><a class="btn" href="${esc(v.src)}" download="${esc(v.datei || "")}">${T.dl}</a><span class="hint">${T.hint}</span></div>
        </section>`).join("")}
        <article class="guide" id="anleitung"><p class="empty">${T.load}</p></article>`;

      fetch(`anleitungen/${encodeURIComponent(app.id)}${EN ? "-en" : ""}.md`)
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(md => {
          const html = window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
          document.getElementById("anleitung").innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
        })
        .catch(() => {
          document.getElementById("anleitung").innerHTML = `<p>${T.none}</p>`;
        });
    }
  </script>
</body>
</html>
