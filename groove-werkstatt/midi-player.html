<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI-Player</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F3A34; --panel:#17302B; --ink:#EFE9DC; --muted:#9DB3AA;
    --brass:#C9A54E; --note:#A8D5C2; --note-hot:#F2D98B; --mute:#B4695A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fraunces',Georgia,serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
  .site-nav{width:100%;max-width:820px;display:flex;gap:18px;font-size:14px;margin-bottom:14px}
  .site-nav a{color:var(--muted);text-decoration:none;padding-bottom:2px}
  .site-nav a:hover{color:var(--ink)}
  .site-nav a[aria-current]{color:var(--ink);border-bottom:1.5px solid var(--brass)}
  header{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  h1{margin:0;font-weight:300;font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
  #title{color:var(--muted);font-size:15px}
  .roll-wrap{width:100%;max-width:820px;margin-top:22px;background:var(--panel);border-radius:14px;padding:14px;position:relative}
  canvas{display:block;width:100%;height:280px;border-radius:8px;cursor:pointer}
  .controls{width:100%;max-width:820px;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  button{font-family:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--brass);color:#1a2620}
  button.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--muted);font-weight:300}
  button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:3px}
  .time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:16px}
  .row{width:100%;max-width:820px;margin-top:20px;display:flex;gap:26px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:15px}
  .row label{display:flex;align-items:center;gap:10px}
  input[type=range]{accent-color:var(--brass);width:130px}
  select{font-family:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--muted);border-radius:6px;padding:4px 8px}
  .upload{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
  .upload input{position:absolute;opacity:0;width:1px;height:1px}
  .hint{font-size:14px;color:var(--muted);margin:14px 0 0;max-width:820px;width:100%}
  .playlist{width:100%;max-width:820px;margin-top:22px;list-style:none;padding:0}
  .playlist li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:16px}
  .playlist li:hover{background:var(--panel)}
  .playlist li.current{background:var(--panel);box-shadow:inset 3px 0 0 var(--brass)}
  .playlist li .len{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .playlist li .rm{background:none;border:0;color:var(--muted);padding:2px 6px;font-size:18px;line-height:1}
  .playlist li .rm:hover{color:var(--ink)}
  .tracks{width:100%;max-width:820px;margin-top:20px}
  .tracks h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .track-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:9px;padding:10px 14px;margin-bottom:8px}
  .track-row .tname{min-width:180px;font-size:16px}
  .tbtn{font-family:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--muted);border-radius:999px;padding:5px 15px;background:transparent;color:var(--ink);cursor:pointer}
  .tbtn.mute.on{background:var(--mute);border-color:var(--mute);color:#1a1a1a}
  .tbtn.solo.on{background:var(--brass);border-color:var(--brass);color:#1a2620}
  .tvol{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--muted);font-size:14px}
  .tvol input[type=range]{width:110px}
  body.drag::after{content:"MIDI-Dateien hier ablegen";position:fixed;inset:0;display:grid;place-items:center;background:rgba(31,58,52,.92);color:var(--brass);font-size:30px;font-weight:300;border:3px dashed var(--brass);margin:14px;border-radius:18px}
  @media (prefers-reduced-motion:reduce){canvas{transition:none}}
</style>

<header>
  <h1>MIDI-Player</h1>
  <span id="title">Ode an die Freude · D-Dur</span>
</header>

<div class="roll-wrap"><canvas id="roll" aria-label="Notenrolle, zum Springen klicken"></canvas></div>

<div class="controls">
  <button id="play">Abspielen</button>
  <button id="stop" class="quiet">Stopp</button>
  <span class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
</div>

<div class="row">
  <label>Tempo <input id="tempo" type="range" min="50" max="150" value="100"> <span id="tempoVal">100 %</span></label>
  <label>Klang
    <select id="wave">
      <option value="samples">Echte Instrumente – voll</option>
      <option value="samples-lite">Echte Instrumente – schlank</option>
      <option value="triangle">Synth weich</option>
      <option value="sine">Synth rund</option>
      <option value="square">Synth Orgel</option>
      <option value="sawtooth">Synth kantig</option>
    </select>
  </label>
  <label>Raum
    <select id="room">
      <option value="studio">Studio</option>
      <option value="room" selected>Zimmer</option>
      <option value="hall">Konzertsaal</option>
      <option value="church">Kirche</option>
    </select>
  </label>
</div>
<div class="row">
  <label>Hall <input id="reverb" type="range" min="0" max="100" value="30"> <span id="reverbVal">30 %</span></label>
  <label>Brillanz <input id="tone" type="range" min="-6" max="8" value="2"> <span id="toneVal">+2 dB</span></label>
  <label>Lautstärke <input id="vol" type="range" min="0" max="100" value="85"> <span id="volVal">85 %</span></label>
  <label class="upload">MIDI-Dateien hinzufügen <input id="file" type="file" accept=".mid,.midi" multiple></label>
</div>
<div class="tracks" id="tracks" hidden></div>
<p class="hint" id="status">Dateien auswählen oder einfach auf die Seite ziehen.</p>
<ul class="playlist" id="playlist"></ul>

<script>
// ---------- Eingebettete Datei ----------
const EMBEDDED = "TVRoZAAAAAYAAQACA8BNVHJrAAAACwD/UQMHoSAA/y8ATVRyawAAAjUAwAAAkEJkh0CAQmQAkEJkh0CAQmQAkENkh0CAQ2QAkEVkh0CARWQAkEVkh0CARWQAkENkh0CAQ2QAkEJkh0CAQmQAkEBkh0CAQGQAkD5kh0CAPmQAkD5kh0CAPmQAkEBkh0CAQGQAkEJkh0CAQmQAkEJkiyCAQmQAkEBkg2CAQGQAkEBkjwCAQGQAkEJkh0CAQmQAkEJkh0CAQmQAkENkh0CAQ2QAkEVkh0CARWQAkEVkh0CARWQAkENkh0CAQ2QAkEJkh0CAQmQAkEBkh0CAQGQAkD5kh0CAPmQAkD5kh0CAPmQAkEBkh0CAQGQAkEJkh0CAQmQAkEBkiyCAQGQAkD5kg2CAPmQAkD5kjwCAPmQAkEBkh0CAQGQAkEBkh0CAQGQAkEJkh0CAQmQAkD5kh0CAPmQAkEBkh0CAQGQAkEJkg2CAQmQAkENkg2CAQ2QAkEJkh0CAQmQAkD5kh0CAPmQAkEBkh0CAQGQAkEJkg2CAQmQAkENkg2CAQ2QAkEJkh0CAQmQAkEBkh0CAQGQAkD5kh0CAPmQAkEBkh0CAQGQAkDlkjwCAOWQAkEJkh0CAQmQAkEJkh0CAQmQAkENkh0CAQ2QAkEVkh0CARWQAkEVkh0CARWQAkENkh0CAQ2QAkEJkh0CAQmQAkEBkh0CAQGQAkD5kh0CAPmQAkD5kh0CAPmQAkEBkh0CAQGQAkEJkh0CAQmQAkEBkiyCAQGQAkD5kg2CAPmQAkD5kjwCAPmQA/y8A";

// ---------- MIDI-Parser ----------
// Neu gegenüber der Erstfassung: Controller werden ausgewertet (Haltepedal CC64,
// Kanal-Lautstärke CC7, Expression CC11, Panorama CC10, All-Notes-Off CC120/123).
// Vor allem das Haltepedal ist für einen authentischen Klavierklang entscheidend.
function parseMidi(buf){
  const d=new DataView(buf); let p=0;
  const u32=()=>{const v=d.getUint32(p);p+=4;return v}, u16=()=>{const v=d.getUint16(p);p+=2;return v}, u8=()=>d.getUint8(p++);
  const vlq=()=>{let v=0,b;do{b=u8();v=(v<<7)|(b&0x7f)}while(b&0x80);return v};
  if(u32()!==0x4d546864) throw new Error("Keine gültige MIDI-Datei");
  u32(); u16(); const ntrk=u16(), div=u16();
  const events=[]; let ord=0;
  for(let t=0;t<ntrk;t++){
    if(u32()!==0x4d54726b) throw new Error("Track-Header fehlt");
    const len=u32(), end=p+len; let tick=0, status=0;
    while(p<end){
      tick+=vlq(); let b=u8();
      if(b<0x80){b=status;p--} else status=b;
      if(b===0xff){const type=u8(), l=vlq();
        if(type===0x51){events.push({tick,ord:ord++,type:'tempo',tempo:(u8()<<16)|(u8()<<8)|u8()})} else p+=l;
      } else if(b===0xf0||b===0xf7){p+=vlq()}
      else{const hi=b&0xf0, ch=b&15;
        if(hi===0x90){const n=u8(),v=u8();events.push({tick,ord:ord++,type:v?'on':'off',note:n,vel:v,ch})}
        else if(hi===0x80){const n=u8();u8();events.push({tick,ord:ord++,type:'off',note:n,ch})}
        else if(hi===0xb0){const cc=u8(),v=u8();events.push({tick,ord:ord++,type:'cc',ch,cc,val:v})}
        else if(hi===0xc0){events.push({tick,ord:ord++,type:'prog',ch,prog:u8()})}
        else if(hi===0xd0){u8()} else {u8();u8()}
      }
    }
    p=end;
  }
  events.sort((a,b)=>a.tick-b.tick||a.ord-b.ord);

  // Ticks -> Sekunden, inkl. Pedal- und Lautstärkeverlauf
  let tempo=500000, lastTick=0, time=0;
  const open={}, notes=[], progs={}, vol={}, expr={}, pan={}, pedal={}, held={};
  for(let c=0;c<16;c++){vol[c]=127;expr[c]=127;pan[c]=64;pedal[c]=false;held[c]=[]}
  const close=(key,at)=>{
    const o=open[key]; if(!o) return null; delete open[key];
    const nt={note:o.note,start:o.start,end:Math.max(at,o.start+0.03),vel:o.vel,drum:o.ch===9,prog:o.prog,amp:o.amp,pan:o.pan,ch:o.ch};
    notes.push(nt); return nt;
  };
  for(const e of events){
    time+=(e.tick-lastTick)*tempo/div/1e6; lastTick=e.tick;
    if(e.type==='tempo'){tempo=e.tempo; continue}
    const ch=e.ch;
    if(e.type==='prog'){progs[ch]=e.prog; continue}
    if(e.type==='cc'){
      if(e.cc===7) vol[ch]=e.val;
      else if(e.cc===11) expr[ch]=e.val;
      else if(e.cc===10) pan[ch]=e.val;
      else if(e.cc===64){
        const down=e.val>=64;
        if(pedal[ch]&&!down){ for(const nt of held[ch]) nt.end=Math.max(nt.end,time); held[ch]=[] }
        pedal[ch]=down;
      } else if(e.cc===120||e.cc===123){
        for(const k in open) if(open[k].ch===ch) close(k,time);
        for(const nt of held[ch]) nt.end=Math.max(nt.end,time); held[ch]=[];
      }
      continue;
    }
    const key=ch*128+e.note;
    if(e.type==='on'){
      close(key,time);
      // gleicher Ton neu angeschlagen -> zuvor gehaltener Klang endet hier
      const h=held[ch];
      for(let i=h.length-1;i>=0;i--) if(h[i].note===e.note){h[i].end=Math.max(h[i].start+0.03,time-0.004); h.splice(i,1)}
      open[key]={note:e.note,start:time,vel:e.vel,ch,prog:progs[ch]||0,
                 amp:(vol[ch]/127)*(expr[ch]/127), pan:(pan[ch]-64)/63};
    } else if(e.type==='off'){
      const nt=close(key,time);
      if(nt&&pedal[ch]&&ch!==9) held[ch].push(nt);
    }
  }
  for(const k in open) close(k,time);
  for(let c=0;c<16;c++) for(const nt of held[c]) nt.end=Math.max(nt.end,time);

  notes.sort((a,b)=>a.start-b.start);
  let duration=time, lo=127, hi=0;
  for(const n of notes){ if(n.end>duration) duration=n.end; if(n.note<lo) lo=n.note; if(n.note>hi) hi=n.note }
  if(!notes.length){lo=48;hi=72}
  return {notes,duration,lo,hi};
}

// ---------- Player ----------
let ctx, song=null, playing=false, startAt=0, offset=0, rate=1, sched=null, scheduledIdx=0, active=[];
const $=id=>document.getElementById(id);
const canvas=$('roll'), cx=canvas.getContext('2d');

function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function pos(){return playing?offset+(ctx.currentTime-startAt)*rate:offset}
// was gerade zu HÖREN ist (Ausgabelatenz herausgerechnet) – für die Notenrolle
function heardPos(){ const l=ctx?(ctx.outputLatency||ctx.baseLatency||0):0; return playing?pos()-l*rate:pos() }

// ---------- Master-Signalweg ----------
// Trockensignal + Faltungshall, danach sanfte Kompression und ein Limiter.
// Das ist der grösste Unterschied zu vorher: einzelne Samples direkt an
// ctx.destination klingen immer flach und "computerhaft"; erst Raum, Bündelung
// und ein wenig Höhenglanz lassen es nach einem Keyboard/Instrument klingen.
let master=null, preFilt=null, shelf=null, dryG=null, wetSend=null, wetFilt=null, conv=null, outG=null;
let revAmt=0.30, volAmt=0.85, toneDb=2, roomName='room';
const ROOMS={ studio:{dur:1.1,decay:3.2,pre:0.008,tone:9000}, room:{dur:1.9,decay:2.4,pre:0.016,tone:7600},
              hall:{dur:3.2,decay:1.9,pre:0.028,tone:6400}, church:{dur:5.0,decay:1.5,pre:0.040,tone:5200} };

function makeIR(spec){
  const sr=ctx.sampleRate, len=Math.max(1,Math.floor(sr*spec.dur)), buf=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c); let lp=0;
    for(let i=0;i<len;i++){
      const t=i/len;
      lp=lp*0.62+(Math.random()*2-1)*0.38;      // gefilterte, wärmere Diffusion
      d[i]=lp*Math.pow(1-t,spec.decay);
    }
    // frühe Reflexionen, pro Kanal leicht versetzt -> echte Stereobreite
    [0.0091,0.0163,0.0241,0.0347,0.0512,0.0713].forEach((s,k)=>{
      const i=Math.floor(sr*(s+(c?0.0017:0)));
      if(i<len) d[i]+=(0.62-k*0.09)*(c?-1:1);
    });
    const fi=Math.floor(sr*0.003); for(let i=0;i<fi;i++) d[i]*=i/fi;   // kein Knacken
  }
  return buf;
}
function buildChain(){
  master=ctx.createGain(); master.gain.value=0.9;
  preFilt=ctx.createBiquadFilter(); preFilt.type='highpass'; preFilt.frequency.value=30;  // Rumpeln weg
  shelf=ctx.createBiquadFilter(); shelf.type='highshelf'; shelf.frequency.value=6200; shelf.gain.value=toneDb;
  dryG=ctx.createGain(); dryG.gain.value=1;
  wetSend=ctx.createGain(); wetSend.gain.value=revAmt;
  const pre=ctx.createDelay(0.2); pre.delayTime.value=ROOMS[roomName].pre;
  conv=ctx.createConvolver(); conv.normalize=true; conv.buffer=makeIR(ROOMS[roomName]);
  wetFilt=ctx.createBiquadFilter(); wetFilt.type='lowpass'; wetFilt.frequency.value=ROOMS[roomName].tone;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.knee.value=20; comp.ratio.value=2.2; comp.attack.value=0.006; comp.release.value=0.26;
  const makeup=ctx.createGain(); makeup.gain.value=1.6;
  const lim=ctx.createDynamicsCompressor();
  lim.threshold.value=-1.5; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=0.002; lim.release.value=0.09;
  outG=ctx.createGain(); outG.gain.value=volAmt;

  master.connect(preFilt); preFilt.connect(shelf);
  shelf.connect(dryG); dryG.connect(comp);
  shelf.connect(wetSend); wetSend.connect(pre); pre.connect(conv); conv.connect(wetFilt); wetFilt.connect(comp);
  comp.connect(makeup); makeup.connect(lim); lim.connect(outG); outG.connect(ctx.destination);
  window._pre=pre;
}
function ensureCtx(){
  if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'}); buildChain() }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function applyMix(){
  if(!ctx) return; const t=ctx.currentTime;
  wetSend.gain.setTargetAtTime(revAmt,t,0.05);
  outG.gain.setTargetAtTime(volAmt,t,0.05);
  shelf.gain.setTargetAtTime(toneDb,t,0.05);
}
function applyRoom(){
  if(!ctx) return; const s=ROOMS[roomName];
  conv.buffer=makeIR(s); wetFilt.frequency.value=s.tone; window._pre.delayTime.value=s.pre;
}
function bus(){ return master||ctx.destination }

// ---------- Spuren: Mute/Solo/Lautstärke je MIDI-Kanal ----------
// Zwischen jeder Notenquelle und dem gemeinsamen Master sitzt pro Kanal ein
// eigener Gain-Knoten. So lässt sich jede Spur unabhängig regeln, ohne den
// Signalweg (Hall, Kompressor, Limiter) zu verdoppeln.
let trackState={}, chGain={};
function channelBus(ch){
  if(!ctx) return null;
  if(!chGain[ch]){ const g=ctx.createGain(); g.gain.value=trackGain(ch); g.connect(bus()); chGain[ch]=g }
  return chGain[ch];
}
function trackGain(ch){
  const t=trackState[ch]; if(!t) return 1;
  const anySolo=Object.values(trackState).some(x=>x.solo);
  return (t.mute||(anySolo&&!t.solo)) ? 0 : t.vol;
}
function applyTrackMix(){
  if(!ctx) return; const t=ctx.currentTime;
  for(const ch in chGain) chGain[ch].gain.setTargetAtTime(trackGain(ch),t,0.03);
}

// ---------- Sampler (echte Samples via smplr) ----------
const GM=["acoustic_grand_piano","bright_acoustic_piano","electric_grand_piano","honkytonk_piano","electric_piano_1","electric_piano_2","harpsichord","clavinet","celesta","glockenspiel","music_box","vibraphone","marimba","xylophone","tubular_bells","dulcimer","drawbar_organ","percussive_organ","rock_organ","church_organ","reed_organ","accordion","harmonica","tango_accordion","acoustic_guitar_nylon","acoustic_guitar_steel","electric_guitar_jazz","electric_guitar_clean","electric_guitar_muted","overdriven_guitar","distortion_guitar","guitar_harmonics","acoustic_bass","electric_bass_finger","electric_bass_pick","fretless_bass","slap_bass_1","slap_bass_2","synth_bass_1","synth_bass_2","violin","viola","cello","contrabass","tremolo_strings","pizzicato_strings","orchestral_harp","timpani","string_ensemble_1","string_ensemble_2","synth_strings_1","synth_strings_2","choir_aahs","voice_oohs","synth_choir","orchestra_hit","trumpet","trombone","tuba","muted_trumpet","french_horn","brass_section","synth_brass_1","synth_brass_2","soprano_sax","alto_sax","tenor_sax","baritone_sax","oboe","english_horn","bassoon","clarinet","piccolo","flute","recorder","pan_flute","blown_bottle","shakuhachi","whistle","ocarina","lead_1_square","lead_2_sawtooth","lead_3_calliope","lead_4_chiff","lead_5_charang","lead_6_voice","lead_7_fifths","lead_8_bass__lead","pad_1_new_age","pad_2_warm","pad_3_polysynth","pad_4_choir","pad_5_bowed","pad_6_metallic","pad_7_halo","pad_8_sweep","fx_1_rain","fx_2_soundtrack","fx_3_crystal","fx_4_atmosphere","fx_5_brightness","fx_6_goblins","fx_7_echoes","fx_8_scifi","sitar","banjo","shamisen","koto","kalimba","bagpipe","fiddle","shanai","tinkle_bell","agogo","steel_drums","woodblock","taiko_drum","melodic_tom","synth_drum","reverse_cymbal","guitar_fret_noise","breath_noise","seashore","bird_tweet","telephone_ring","helicopter","applause","gunshot"];
// Pegelausgleich: die GM-Soundfonts sind je Familie unterschiedlich laut abgemischt.
function famVolume(prog){
  if(prog<8) return 105;         // Klaviere
  if(prog<16) return 95;
  if(prog<24) return 88;         // Orgeln sind sehr präsent
  if(prog<32) return 100;
  if(prog<40) return 108;        // Bässe etwas nach vorn
  if(prog<56) return 96;         // Streicher
  if(prog<64) return 92;         // Blech
  if(prog<80) return 98;         // Holz
  return 95;
}
let smplr=null, smplrFailed=false, curKit=null;
const insts={};                 // "kanal:programm" -> {inst,gain,ready}
let drumKit=null, drumMap={};
async function loadSmplr(){
  if(smplr||smplrFailed) return smplr;
  for(const url of ["https://unpkg.com/smplr@1.0.0/dist/index.mjs","https://esm.sh/smplr@1.0.0","https://cdn.jsdelivr.net/npm/smplr@1.0.0/dist/index.mjs"]){
    try{ smplr=await import(url); return smplr }catch(e){}
  }
  smplrFailed=true; $('status').textContent='Samples nicht erreichbar – hochwertiger Synth-Klang wird verwendet.'; return null;
}
function pick(groups,...keys){ for(const k of keys){ const g=groups.find(x=>x.toLowerCase().includes(k)); if(g) return g } return null }
function buildDrumMap(groups){
  const kick=pick(groups,'kick','bd','bass'), snare=pick(groups,'snare','sd'), rim=pick(groups,'rim')||snare,
        chh=pick(groups,'closed','ch','hat','hh'), ohh=pick(groups,'open','oh')||chh, clap=pick(groups,'clap','cp')||snare,
        tomL=pick(groups,'tom-low','low tom','lt','tom'), tomM=pick(groups,'tom-mid','mid tom','mt','tom')||tomL, tomH=pick(groups,'tom-hi','hi tom','ht','tom')||tomM,
        crash=pick(groups,'crash','cymbal','cy')||ohh, ride=pick(groups,'ride','rd')||crash, cow=pick(groups,'cowbell','cb'), tamb=pick(groups,'tamb','shaker','maracas')||chh;
  const m={35:kick,36:kick,37:rim,38:snare,39:clap,40:snare,41:tomL,42:chh,43:tomL,44:chh,45:tomM,46:ohh,47:tomM,48:tomH,49:crash,50:tomH,51:ride,52:crash,53:ride,54:tamb,55:crash,56:cow,57:crash,59:ride,69:tamb,70:tamb,75:rim,76:rim,77:rim};

function ikey(n){ return n.ch+':'+n.prog }
// Jede Kanal/Programm-Kombination bekommt einen eigenen Kanalzug mit Panorama –
// so bleibt ein Arrangement räumlich gestaffelt statt alles in der Mitte.
function makeStrip(n,prog){
  const g=ctx.createGain(); g.gain.value=1;
  if(ctx.createStereoPanner){
    const p=ctx.createStereoPanner();
    p.pan.value=Math.max(-1,Math.min(1,(n.pan||0)*0.75));
    g.connect(p); p.connect(channelBus(n.ch));
  } else g.connect(channelBus(n.ch));
  return g;
}
async function ensureInstruments(){
  if(!song||!wantSamples()) return;
  const lib=await loadSmplr(); if(!lib) return;
  const kit=$('wave').value==='samples-lite'?'FluidR3_GM':'MusyngKite';
  if(curKit&&curKit!==kit){ for(const k in insts) delete insts[k] }
  curKit=kit;
  const first={};
  for(const n of song.notes){ if(n.drum) continue; const k=ikey(n); if(!first[k]) first[k]=n }
  const need=Object.keys(first).filter(k=>!insts[k]);
  const hasDrums=song.notes.some(n=>n.drum)&&!drumKit;
  if(!need.length&&!hasDrums) return;
  $('status').textContent='Klänge werden geladen…';
  const jobs=need.map(k=>{
    const n=first[k], prog=n.prog, g=makeStrip(n,prog);
    const inst=lib.Soundfont(ctx,{instrument:GM[prog]||GM[0],kit,destination:g,volume:famVolume(prog)});
    const rec={inst,gain:g,ready:false}; insts[k]=rec;
    return inst.ready.then(()=>{rec.ready=true});
  });
  if(hasDrums){
    const dg=ctx.createGain(); dg.gain.value=1; dg.connect(channelBus(9));
    drumKit=lib.DrumMachine(ctx,{instrument:'LM-2',destination:dg,volume:100});
    jobs.push(drumKit.ready.then(()=>{drumMap=buildDrumMap(drumKit.getGroupNames())}));
  }
  try{ await Promise.all(jobs) }
  catch(e){ smplrFailed=true; $('status').textContent='Samples konnten nicht geladen werden – hochwertiger Synth-Klang wird verwendet.'; return }
  $('status').textContent=`${song.notes.length} Noten, ${fmt(song.duration)} lang.`;
}
function wantSamples(){ return $('wave').value.indexOf('samples')===0 }
function useSamples(){ return wantSamples()&&smplr&&!smplrFailed }

// ---------- Synth-Engine (Fallback und Synth-Klangfarben) ----------
// Statt eines nackten Oszillators bekommt jede GM-Familie ein eigenes Patch mit
// mehreren verstimmten Oszillatoren, Filterhüllkurve, Vibrato und Stereobreite.
const PATCH={
  piano:   {osc:[{t:'triangle',d:0,g:1},{t:'sine',r:2,g:.30},{t:'sine',d:-7,g:.45}], atk:.003,dec:1.7,sus:.05,rel:.30,cut:900, trk:2.2,env:6, cdec:.70,q:.8, sp:.10},
  bell:    {osc:[{t:'sine',g:1},{t:'sine',r:3.01,g:.34},{t:'sine',r:5.03,g:.14}],     atk:.002,dec:1.4,sus:.02,rel:.55,cut:1600,trk:3.0,env:4, cdec:.55,q:.6, sp:.20},
  organ:   {osc:[{t:'sine',g:1},{t:'sine',r:2,g:.50},{t:'sine',r:3,g:.28},{t:'sine',r:4,g:.18},{t:'sine',r:6,g:.10}], atk:.010,dec:.10,sus:.95,rel:.055,cut:2400,trk:2.5,env:1.4,cdec:.10,q:.5,sp:.12},
  guitar:  {osc:[{t:'sawtooth',d:-5,g:.80},{t:'triangle',d:6,g:.60}],                 atk:.004,dec:1.1,sus:.07,rel:.26,cut:700, trk:2.0,env:8, cdec:.35,q:1.1,sp:.16},
  bass:    {osc:[{t:'sawtooth',g:.70},{t:'sine',r:.5,g:.85},{t:'triangle',d:7,g:.35}],atk:.006,dec:1.0,sus:.32,rel:.16,cut:300, trk:1.2,env:7, cdec:.26,q:1.4,sp:.04},
  strings: {osc:[{t:'sawtooth',d:-8,g:.60},{t:'sawtooth',d:8,g:.60},{t:'sawtooth',r:.5,g:.22}], atk:.14,dec:.45,sus:.85,rel:.38,cut:900,trk:1.8,env:2.2,cdec:.90,q:.7,vib:9, vr:5.2,vd:.35,sp:.30},
  ensemble:{osc:[{t:'sawtooth',d:-10,g:.55},{t:'sawtooth',d:10,g:.55},{t:'triangle',g:.32}],    atk:.18,dec:.55,sus:.88,rel:.55,cut:820,trk:1.6,env:2.0,cdec:1.1,q:.6,vib:7, vr:4.6,vd:.40,sp:.36},
  brass:   {osc:[{t:'sawtooth',d:-4,g:.70},{t:'sawtooth',d:4,g:.70}],                 atk:.055,dec:.35,sus:.80,rel:.19,cut:480,trk:1.5,env:9,cdec:.50,q:1.2,vib:6,vr:5.0,vd:.40,sp:.20},
  wind:    {osc:[{t:'triangle',g:.90},{t:'sawtooth',g:.16},{t:'sine',r:2,g:.20}],      atk:.048,dec:.28,sus:.90,rel:.17,cut:1400,trk:2.0,env:3,cdec:.42,q:.8,vib:11,vr:5.6,vd:.30,sp:.16},
  lead:    {osc:[{t:'sawtooth',d:-6,g:.70},{t:'square',d:6,g:.42}],                    atk:.010,dec:.50,sus:.70,rel:.22,cut:820,trk:2.0,env:7,cdec:.60,q:1.3,vib:8,vr:5.4,vd:.35,sp:.22},
  pad:     {osc:[{t:'sawtooth',d:-12,g:.50},{t:'sawtooth',d:12,g:.50},{t:'sine',r:.5,g:.28}],   atk:.50,dec:.85,sus:.90,rel:.95,cut:700,trk:1.2,env:2.5,cdec:1.6,q:.6,vib:5,vr:3.4,vd:.60,sp:.40}
};
function family(p){
  if(p<8) return 'piano'; if(p<16) return 'bell'; if(p<24) return 'organ'; if(p<32) return 'guitar';
  if(p<40) return 'bass'; if(p<48) return 'strings'; if(p<56) return 'ensemble'; if(p<64) return 'brass';
  if(p<80) return 'wind'; if(p<96) return 'lead'; return 'pad';
}
function track(node){ active.push(node); node.onended=()=>{const i=active.indexOf(node); if(i>=0) active.splice(i,1)} }
function playSynth(n,when,dur){
  const P=PATCH[family(n.prog||0)]||PATCH.piano;
  const forced=wantSamples()?null:$('wave').value;
  const f0=440*Math.pow(2,(n.note-69)/12);
  const vel=Math.pow(n.vel/127,1.15)*(n.amp==null?1:n.amp);
  const atk=P.atk, rel=P.rel;
  const relAt=when+Math.max(dur,atk+0.03);
  const stopAt=relAt+rel*3+0.05;

  const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.Q.value=P.q;
  const base=Math.min(15000,P.cut+P.trk*f0);
  const top=Math.min(17500,base*(1+P.env*(0.35+0.65*vel)));
  filt.frequency.setValueAtTime(top,when);
  filt.frequency.setTargetAtTime(base,when+atk,P.cdec/3);

  const amp=ctx.createGain();
  let sum=0; for(const o of P.osc) sum+=o.g;
  const peak=Math.max(0.001,vel*0.30/Math.max(1,sum*0.7));
  amp.gain.setValueAtTime(0.0001,when);
  amp.gain.linearRampToValueAtTime(peak,when+atk);
  amp.gain.setTargetAtTime(peak*P.sus,when+atk,Math.max(0.02,P.dec)/3);
  amp.gain.setTargetAtTime(0.0001,relAt,Math.max(0.02,rel)/3);

  filt.connect(amp);
  if(ctx.createStereoPanner){
    const pan=ctx.createStereoPanner();
    const base_=(n.pan==null?0:n.pan)*0.7;
    pan.pan.value=Math.max(-1,Math.min(1,base_+((n.note%7)/7-0.5)*2*P.sp));
    amp.connect(pan); pan.connect(channelBus(n.ch));
  } else amp.connect(channelBus(n.ch));

  // Vibrato erst nach kurzer Verzögerung – wie bei einem echten Spieler
  let vibGain=null;
  if(P.vib){
    const lfo=ctx.createOscillator(); lfo.frequency.value=P.vr;
    vibGain=ctx.createGain(); vibGain.gain.setValueAtTime(0,when);
    vibGain.gain.setTargetAtTime(P.vib,when+P.vd,0.25);
    lfo.connect(vibGain); lfo.start(when); lfo.stop(stopAt); track(lfo);
  }
  for(const spec of P.osc){
    const o=ctx.createOscillator();
    o.type=forced||spec.t;
    o.frequency.value=f0*(spec.r||1);
    o.detune.value=(spec.d||0)+(Math.random()*3-1.5);      // minimale Streuung = lebendiger
    if(vibGain) vibGain.connect(o.detune);
    const g=ctx.createGain(); g.gain.value=spec.g/Math.max(1,sum*0.7);
    o.connect(g); g.connect(filt);
    o.start(when); o.stop(stopAt); track(o);
  }
}

// ---------- Schlagzeug-Synthese (Fallback) ----------
let noiseBuf=null;
function noise(){
  if(!noiseBuf){noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s;
}
function env(g,when,peak,dec){ g.gain.setValueAtTime(Math.max(0.0001,peak),when); g.gain.exponentialRampToValueAtTime(0.0001,when+dec) }
function metal(when,v,dec,hp,bp,dest){
  // klassische Hi-Hat/Becken-Synthese: sechs verstimmte Rechtecke
  const out=ctx.createGain(); env(out,when,v,dec);
  const h=ctx.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp;
  const b=ctx.createBiquadFilter(); b.type='bandpass'; b.frequency.value=bp; b.Q.value=1.2;
  h.connect(b); b.connect(out); out.connect(dest);
  [2,3,4.16,5.43,6.79,8.21].forEach(r=>{
    const o=ctx.createOscillator(); o.type='square'; o.frequency.value=40*r;
    o.connect(h); o.start(when); o.stop(when+dec+0.05); track(o);
  });
  const nz=noise(), ng=ctx.createGain(); ng.gain.value=0.35; nz.connect(ng); ng.connect(h);
  nz.start(when); nz.stop(when+dec+0.05); track(nz);
}
function playDrum(n,when){
  const v=Math.max(0.05,(n.vel/127))*(n.amp==null?1:n.amp), k=n.note, d=channelBus(n.ch);
  if(k===35||k===36){                                   // Bassdrum: Tonhöhenhüllkurve + Click
    const g=ctx.createGain(); g.connect(d);
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(k===35?150:165,when);
    o.frequency.exponentialRampToValueAtTime(45,when+0.09);
    env(g,when,v*1.15,0.42); o.connect(g); o.start(when); o.stop(when+0.5); track(o);
    const c=noise(), cf=ctx.createBiquadFilter(); cf.type='highpass'; cf.frequency.value=2500;
    const cg=ctx.createGain(); env(cg,when,v*0.30,0.02);
    c.connect(cf); cf.connect(cg); cg.connect(d); c.start(when); c.stop(when+0.05); track(c);
  }
  else if(k===38||k===40||k===37||k===39){              // Snare / Rim / Clap
    const body=ctx.createGain(); body.connect(d);
    [185,278].forEach((f,i)=>{const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
      const g=ctx.createGain(); env(g,when,v*(i?0.22:0.38),0.09); o.connect(g); g.connect(body); o.start(when); o.stop(when+0.15); track(o)});
    const s=noise(), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=k===37?2600:1800; bp.Q.value=0.9;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
    const g=ctx.createGain(); env(g,when,v*(k===37?0.35:0.75),k===37?0.06:0.19);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(d); s.start(when); s.stop(when+0.3); track(s);
  }
  else if(k===42||k===44){ metal(when,v*0.42,k===44?0.07:0.05,7000,10500,d) }
  else if(k===46){        metal(when,v*0.46,0.36,6500,9000,d) }
  else if(k===49||k===52||k===55||k===57){ metal(when,v*0.42,1.7,3800,6000,d) }
  else if(k===51||k===53||k===59){         metal(when,v*0.34,1.1,5200,8000,d) }
  else if(k>=41&&k<=50){                                // Toms
    const g=ctx.createGain(); g.connect(d);
    const base=k<=43?95:k<=47?135:190;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(base*1.6,when); o.frequency.exponentialRampToValueAtTime(base,when+0.12);
    env(g,when,v*0.85,0.42); o.connect(g); o.start(when); o.stop(when+0.5); track(o);
    const s=noise(), sf=ctx.createBiquadFilter(); sf.type='bandpass'; sf.frequency.value=base*3;
    const sg=ctx.createGain(); env(sg,when,v*0.18,0.06); s.connect(sf); sf.connect(sg); sg.connect(d);
    s.start(when); s.stop(when+0.12); track(s);
  }
  else {                                                // Percussion allgemein
    const g=ctx.createGain(); g.connect(d);
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=k<60?420:820;
    env(g,when,v*0.5,0.16); o.connect(g); o.start(when); o.stop(when+0.25); track(o);
  }
}

function playNote(n,when,dur){
  if(useSamples()){
    if(n.drum){ const g=drumMap[n.note]; if(drumKit&&g){ drumKit.start({note:g,velocity:Math.round(Math.max(1,Math.min(127,n.vel*(n.amp==null?1:n.amp)))),time:when}); return } }
    else{
      const rec=insts[ikey(n)];
      if(rec&&rec.ready){
        // sanfte Anschlagskurve: leise Töne bleiben hörbar, laute knallen nicht
        const raw=(n.vel/127)*(n.amp==null?1:n.amp);
        const vel=Math.round(Math.max(1,Math.min(127,127*Math.pow(raw,0.88))));
        rec.inst.start({note:n.note,velocity:vel,time:when,duration:Math.max(0.06,dur)});
        return;
      }
    }
  }
  if(n.drum){ playDrum(n,when); return }
  playSynth(n,when,dur);
}
function scheduler(){
  const now=pos(), horizon=now+0.5;
  while(scheduledIdx<song.notes.length&&song.notes[scheduledIdx].start<horizon){
    const n=song.notes[scheduledIdx++]; if(n.end<=now) continue;
    const when=ctx.currentTime+(n.start-now)/rate, dur=(n.end-n.start)/rate;
    playNote(n,Math.max(when,ctx.currentTime+0.01),dur);
  }
  if(now>=song.duration+0.3){ stop(); if(currentIdx<list.length-1) select(currentIdx+1,true); return }
}
async function start(){
  if(!song||playing) return;
  ensureCtx();
  $('play').disabled=true; await ensureInstruments(); $('play').disabled=false;
  if(playing) return;
  scheduledIdx=song.notes.findIndex(n=>n.end>offset); if(scheduledIdx<0) scheduledIdx=song.notes.length;
  startAt=ctx.currentTime; playing=true; $('play').textContent='Pause';
  sched=setInterval(scheduler,80); scheduler();
}
function pause(){
  if(ctx) offset=pos();
  playing=false; clearInterval(sched);
  active.forEach(o=>{try{o.stop()}catch(e){}}); active=[];
  Object.values(insts).forEach(r=>{try{r.inst.stop()}catch(e){}}); if(drumKit){try{drumKit.stop()}catch(e){}}
  $('play').textContent='Abspielen';
}
function stop(){ pause(); offset=0; }

// ---------- Notenrolle ----------
function draw(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(canvas.width!==w*devicePixelRatio){canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio}
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.fillStyle='#12261F'; cx.fillRect(0,0,w,h);
  if(song){
    const t=heardPos(), lo=song.lo-2, hi=song.hi+2;
    const rowH=h/(hi-lo+1), px=s=>s/song.duration*w;
    cx.strokeStyle='rgba(239,233,220,0.06)';
    for(let s=0;s<song.duration;s+=2){cx.beginPath();cx.moveTo(px(s),0);cx.lineTo(px(s),h);cx.stroke()}
    for(const n of song.notes){
      const on=t>=n.start&&t<n.end;
      cx.fillStyle=on?'#F2D98B':(n.start<t?'rgba(168,213,194,0.45)':'#A8D5C2');
      const x=px(n.start), y=h-(n.note-lo+1)*rowH;
      cx.beginPath(); cx.roundRect(x+1,y+2,Math.max(2,px(n.end)-x-2),rowH-4,3); cx.fill();
    }
    cx.fillStyle='#C9A54E'; cx.fillRect(px(t)-1,0,2,h);
    $('cur').textContent=fmt(t); $('dur').textContent=fmt(song.duration);
  }
  requestAnimationFrame(draw);
}

// ---------- Playlist ----------
const list=[]; let currentIdx=-1;
function addFile(buf,name){
  try{ list.push({name,song:parseMidi(buf)}); renderList();
    if(currentIdx<0) select(list.length-1);
  }catch(e){ $('status').textContent=`„${name}" konnte nicht gelesen werden: ${e.message}`; }
}
function select(i,autoplay=false){
  if(i<0||i>=list.length) return;
  stop(); currentIdx=i; song=list[i].song; offset=0;
  $('title').textContent=list[i].name;
  $('status').textContent=`${song.notes.length} Noten, ${fmt(song.duration)} lang.`;
  renderList(); renderTracks(); if(autoplay) start();
}
function remove(i){
  list.splice(i,1);
  if(list.length===0){stop();song=null;currentIdx=-1;$('title').textContent='';$('status').textContent='Playlist ist leer – Dateien hinzufügen.';}
  else if(i===currentIdx) select(Math.min(i,list.length-1));
  else if(i<currentIdx) currentIdx--;
  renderList(); renderTracks();
}
function trackLabel(ch){
  if(ch===9) return 'Schlagzeug';
  const n=song.notes.find(x=>x.ch===ch);
  const gm=GM[n?n.prog:0]||'instrument';
  return gm.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
// Baut das Mixer-Panel für den aktuell geladenen Song neu auf – jeder MIDI-
// Kanal ist eine Spur mit eigenem Stumm/Solo/Lautstärke-Regler.
function renderTracks(){
  const wrap=$('tracks');
  if(!song||!song.notes.length){ wrap.hidden=true; wrap.innerHTML=''; return }
  const channels=[...new Set(song.notes.map(n=>n.ch))].sort((a,b)=>a-b);
  trackState={}; channels.forEach(ch=>trackState[ch]={mute:false,solo:false,vol:1});
  wrap.hidden=false;
  wrap.innerHTML='<h2>Spuren</h2>'+channels.map(ch=>`
    <div class="track-row" data-ch="${ch}">
      <span class="tname">Kanal ${ch+1} · ${trackLabel(ch)}</span>
      <button class="tbtn mute" aria-pressed="false">Stumm</button>
      <button class="tbtn solo" aria-pressed="false">Solo</button>
      <span class="tvol">Lautstärke <input type="range" min="0" max="150" value="100"> <span class="tvolval">100 %</span></span>
    </div>`).join('');
  wrap.querySelectorAll('.track-row').forEach(row=>{
    const ch=+row.dataset.ch;
    const mb=row.querySelector('.mute'), sb=row.querySelector('.solo');
    const vr=row.querySelector('input[type=range]'), vv=row.querySelector('.tvolval');
    mb.onclick=()=>{ trackState[ch].mute=!trackState[ch].mute; mb.classList.toggle('on',trackState[ch].mute); mb.setAttribute('aria-pressed',trackState[ch].mute); applyTrackMix() };
    sb.onclick=()=>{ trackState[ch].solo=!trackState[ch].solo; sb.classList.toggle('on',trackState[ch].solo); sb.setAttribute('aria-pressed',trackState[ch].solo); applyTrackMix() };
    vr.oninput=()=>{ trackState[ch].vol=vr.value/100; vv.textContent=vr.value+' %'; applyTrackMix() };
  });
  applyTrackMix();       // vorhandene Kanal-Busse (von einem vorherigen Song) auf die frischen Werte ziehen
}
function renderList(){
  $('playlist').innerHTML='';
  list.forEach((it,i)=>{
    const li=document.createElement('li'); if(i===currentIdx) li.className='current';
    li.innerHTML=`<span>${it.name}</span><span class="len">${fmt(it.song.duration)}</span><button class="rm" title="Entfernen" aria-label="Entfernen">×</button>`;
    li.onclick=()=>select(i,true);
    li.querySelector('.rm').onclick=e=>{e.stopPropagation();remove(i)};
    $('playlist').appendChild(li);
  });
}
function addFiles(files){
  [...files].filter(f=>/\.midi?$/i.test(f.name)).forEach(f=>f.arrayBuffer().then(b=>addFile(b,f.name.replace(/\.midi?$/i,''))));
}
(function(){const s=atob(EMBEDDED),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);addFile(a.buffer,'Ode an die Freude · D-Dur')})();
// Groove aus der Groove-Werkstatt übernehmen (sequenzer.html legt ihn im localStorage ab)
(function(){
  if(location.hash!=='#groove') return;
  try{
    const raw=localStorage.getItem('groove-export'); localStorage.removeItem('groove-export');
    history.replaceState(null,'',location.pathname);
    if(!raw) return;
    const {name,b64}=JSON.parse(raw), s=atob(b64), a=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
    addFile(a.buffer,name); select(list.length-1);
  }catch(e){}
})();

// ---------- Bedienung ----------
$('play').onclick=()=>playing?pause():start();
$('stop').onclick=stop;
$('tempo').oninput=e=>{const was=playing; if(was)pause(); rate=e.target.value/100; $('tempoVal').textContent=e.target.value+' %'; if(was)start()};
$('wave').onchange=()=>{const was=playing; if(was)pause(); if(was)start()};
$('room').onchange=e=>{roomName=e.target.value; applyRoom()};
$('reverb').oninput=e=>{revAmt=e.target.value/100; $('reverbVal').textContent=e.target.value+' %'; applyMix()};
$('vol').oninput=e=>{volAmt=e.target.value/100; $('volVal').textContent=e.target.value+' %'; applyMix()};
$('tone').oninput=e=>{toneDb=+e.target.value; $('toneVal').textContent=(toneDb>0?'+':'')+toneDb+' dB'; applyMix()};
canvas.onclick=e=>{ if(!song) return; const r=canvas.getBoundingClientRect(); const was=playing; if(was)pause(); offset=(e.clientX-r.left)/r.width*song.duration; if(was)start(); };
$('file').onchange=e=>{addFiles(e.target.files); e.target.value=''};
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'||e.relatedTarget===null)document.body.classList.remove('drag')}));
document.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
draw();
</script>
</body>
