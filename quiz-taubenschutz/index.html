<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Taubenschutz</title>
<meta name="description" content="10 Fragen rund um Stadttauben und Taubenschutz – mit Erklärungen und Vorlesen.">
<meta name="theme-color" content="#2f5bd3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tauben-Quiz">
<style>
  :root{--bg:#eef3fb;--karte:#fff;--text:#1c2433;--mut:#5d6b82;--linie:#d8e1ef;--akzent:#2f5bd3;--akzent-hell:#e6edfc;--gut:#1f9d55;--gut-hell:#e3f6eb;--falsch:#d64545;--falsch-hell:#fde8e8;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#121722;--karte:#1b2232;--text:#e8edf6;--mut:#9aa7bd;--linie:#2c3548;--akzent:#7d9cf5;--akzent-hell:#232d45;--gut:#46c47c;--gut-hell:#173326;--falsch:#f07a7a;--falsch-hell:#3a1d1f;color-scheme:dark}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px 32px;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:760px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .top h1{font-size:24px;margin:0;flex:1;min-width:200px}
  .top a{color:var(--akzent);text-decoration:none;font-weight:600;font-size:15px}
  .fortschritt{display:flex;gap:6px;margin:0 0 14px}
  .fortschritt i{flex:1;height:10px;border-radius:5px;background:var(--linie)}
  .fortschritt i.gut{background:var(--gut)} .fortschritt i.falsch{background:var(--falsch)} .fortschritt i.jetzt{background:var(--akzent)}
  .karte{background:var(--karte);border-radius:20px;padding:22px 20px;box-shadow:0 2px 12px rgba(20,40,80,.08);border:1px solid var(--linie)}
  .nr{color:var(--mut);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .frage{font-size:clamp(22px,4.2vw,30px);font-weight:750;line-height:1.3;margin:10px 0 18px}
  button{font:inherit;cursor:pointer}
  .vorlesen{border:1px solid var(--linie);background:var(--akzent-hell);color:var(--akzent);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px}
  .antworten{display:grid;gap:12px}
  .antwort{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 16px;min-height:64px;border-radius:16px;border:2px solid var(--linie);background:var(--karte);color:var(--text);font-size:clamp(18px,3.2vw,22px);font-weight:600;line-height:1.3}
  .antwort b{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--akzent-hell);color:var(--akzent);font-size:18px}
  .antwort:not(:disabled):hover{border-color:var(--akzent)}
  .antwort.gut{border-color:var(--gut);background:var(--gut-hell)} .antwort.gut b{background:var(--gut);color:#fff}
  .antwort.falsch{border-color:var(--falsch);background:var(--falsch-hell)} .antwort.falsch b{background:var(--falsch);color:#fff}
  .antwort:disabled{cursor:default}
  .antwort:disabled:not(.gut):not(.falsch){opacity:.55}
  .rueck{margin-top:18px;border-radius:16px;padding:16px 18px;font-size:18px;line-height:1.5}
  .rueck.gut{background:var(--gut-hell);border:2px solid var(--gut)} .rueck.falsch{background:var(--falsch-hell);border:2px solid var(--falsch)}
  .rueck strong{display:block;font-size:22px;margin-bottom:4px}
  .weiter{display:block;width:100%;margin-top:16px;padding:18px;border:none;border-radius:16px;background:var(--akzent);color:#fff;font-size:22px;font-weight:800}
  .ende{text-align:center}
  .ende .gross{font-size:clamp(54px,12vw,90px);font-weight:900;color:var(--akzent);line-height:1.1;margin:8px 0}
  .ende .sterne{font-size:40px;letter-spacing:4px}
  .ende p{font-size:20px;line-height:1.5}
  .tipp{color:var(--mut);font-size:14px;text-align:center;margin-top:16px;line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🕊️ Quiz Taubenschutz</h1>
    <a href="../">← Alle Apps</a>
    <a href="../app.html?id=quiz-taubenschutz">Anleitung</a>
  </div>
  <div class="fortschritt" id="fort" aria-hidden="true"></div>
  <main class="karte" id="karte" aria-live="polite"></main>
  <div class="tipp">Tasten <b>1–4</b> wählen eine Antwort, <b>Leertaste</b> oder <b>5</b> geht weiter – so klappt es auch mit den SoundWhackern im Tastatur-Modus.</div>
</div>
<script src="fragen.js?v=1"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const mischen=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const BUCH=['1','2','3','4','5','6'];
  let runde=[], nr=0, ergebnisse=[], beantwortet=false;

  // Vorlesen (deutsche Stimme des Geräts)
  function vorlesen(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=.95; const v=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }
  const kannVorlesen='speechSynthesis' in window;

  function start(){
    runde=mischen(window.FRAGEN).map(f=>{ const reihe=mischen(f.antworten.map((t,i)=>({t,i}))); return { ...f, reihe }; });
    nr=0; ergebnisse=[]; zeigeFrage();
  }
  function fortschritt(){
    $('fort').innerHTML=runde.map((_,i)=>'<i class="'+(i<ergebnisse.length?(ergebnisse[i]?'gut':'falsch'):i===nr?'jetzt':'')+'"></i>').join('');
  }
  function zeigeFrage(){
    beantwortet=false; fortschritt();
    const f=runde[nr];
    $('karte').innerHTML=
      '<div class="nr"><span>Frage '+(nr+1)+' von '+runde.length+'</span>'+(kannVorlesen?'<button class="vorlesen" id="lesen">🔊 Vorlesen</button>':'')+'</div>'+
      '<div class="frage">'+esc(f.frage)+'</div>'+
      '<div class="antworten">'+f.reihe.map((a,k)=>'<button class="antwort" data-k="'+k+'"><b>'+BUCH[k]+'</b><span>'+esc(a.t)+'</span></button>').join('')+'</div>'+
      '<div id="rueck"></div>';
    $('karte').querySelectorAll('.antwort').forEach(b=>b.onclick=()=>waehle(+b.dataset.k));
    if($('lesen')) $('lesen').onclick=()=>vorlesen(f.frage+' '+f.reihe.map((a,k)=>'Antwort '+BUCH[k]+': '+a.t+'.').join(' '));
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function waehle(k){
    if(beantwortet) return; beantwortet=true;
    const f=runde[nr], gut=f.reihe[k].i===f.richtig;
    ergebnisse.push(gut);
    $('karte').querySelectorAll('.antwort').forEach((b,j)=>{ b.disabled=true; if(f.reihe[j].i===f.richtig) b.classList.add('gut'); else if(j===k) b.classList.add('falsch'); });
    const letzte=nr===runde.length-1;
    $('rueck').innerHTML='<div class="rueck '+(gut?'gut':'falsch')+'"><strong>'+(gut?'✅ Richtig!':'❌ Leider falsch.')+'</strong>'+esc(f.erklaerung)+'</div>'+
      '<button class="weiter" id="weiter">'+(letzte?'Zum Ergebnis 🏁':'Weiter ▶')+'</button>';
    $('weiter').onclick=weiter; fortschritt();
    $('rueck').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function weiter(){
    try{ speechSynthesis.cancel(); }catch(e){}
    if(nr<runde.length-1){ nr++; zeigeFrage(); } else ende();
  }
  function ende(){
    nr=runde.length; fortschritt();
    const p=ergebnisse.filter(Boolean).length, n=runde.length;
    const sterne=p===n?3:p>=n*.7?2:p>=n*.4?1:0;
    const text=p===n?'Super! Du bist ein echter Taubenschutz-Profi! 🕊️':p>=n*.7?'Sehr gut – du weißt schon viel über Stadttauben!':p>=n*.4?'Gut gemacht! Spiel nochmal und lerne noch mehr dazu.':'Jetzt weißt du schon mehr – probier es gleich nochmal!';
    $('karte').innerHTML='<div class="ende"><div class="sterne">'+'⭐'.repeat(sterne)+'☆'.repeat(3-sterne)+'</div><div class="gross">'+p+' von '+n+'</div><p>'+text+'</p>'+
      '<button class="weiter" id="nochmal">🔄 Nochmal spielen</button></div>';
    $('nochmal').onclick=start;
  }
  // Tastatur / SoundWhacker-HUB im Tastatur-Modus: 1–4 = Antwort, 5 / Leertaste / Enter = weiter
  addEventListener('keydown',e=>{
    if(e.repeat) return;
    const z=/^(Digit|Numpad)([1-6])$/.exec(e.code), d=z?+z[2]:(/^[1-6]$/.test(e.key)?+e.key:0);
    const imSpiel=nr<runde.length;
    if(imSpiel&&!beantwortet&&d>=1&&d<=runde[nr].reihe.length){ e.preventDefault(); waehle(d-1); return; }
    if((e.key===' '||e.key==='Enter'||d===5)&&(beantwortet||!imSpiel)){ e.preventDefault(); if(imSpiel) weiter(); else start(); }
  });
  start();
})();
</script>
</body>
</html>
