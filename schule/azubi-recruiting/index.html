<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Azubi-Recruiting Dashboard</title>
<meta name="description" content="Steuerzentrale für Azubi-Recruiting-Videos für Handwerksbetriebe im Saarland: Recherche, Video-Entwürfe, Briefversand, Tracking, Änderungen, Abnahme und Zahlung.">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="../../theme.js"></script>
<style>
:root{
  --bg:#eef1f4; --karte:#ffffff; --karte2:#f6f8fa; --ink:#14202b; --mut:#5b6b78; --linie:#d3dbe2;
  --akz:#d9661b; --akz-soft:#fbe7d8; --akz-ink:#ffffff;
  --gut:#23804a; --gut-soft:#dcf2e4; --warn:#b7791f; --warn-soft:#fbefd5; --rot:#c0392b; --rot-soft:#fbe1dd; --blau:#2c63b5; --blau-soft:#e0eaf9;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f151b; --karte:#18212a; --karte2:#1e2833; --ink:#e7eef3; --mut:#9fb0bd; --linie:#2d3a46;
  --akz:#f08a3e; --akz-soft:#3b2414; --akz-ink:#111;
  --gut:#5cc386; --gut-soft:#16301f; --warn:#e3b25a; --warn-soft:#352a12; --rot:#ef7a6c; --rot-soft:#3a1c18; --blau:#8bb2f0; --blau-soft:#1b2a44; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f151b; --karte:#18212a; --karte2:#1e2833; --ink:#e7eef3; --mut:#9fb0bd; --linie:#2d3a46;
  --akz:#f08a3e; --akz-soft:#3b2414; --akz-ink:#111;
  --gut:#5cc386; --gut-soft:#16301f; --warn:#e3b25a; --warn-soft:#352a12; --rot:#ef7a6c; --rot-soft:#3a1c18; --blau:#8bb2f0; --blau-soft:#1b2a44; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding:0 max(16px,env(safe-area-inset-right)) 90px max(16px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--akz);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:18px 0 10px}
header h1{font-size:clamp(22px,3vw,30px)}
header .unter{color:var(--mut);font-size:15px;flex-basis:100%}
.hinweisband{background:var(--blau-soft);border:1px solid var(--linie);border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--linie);background:var(--karte);font-weight:700;cursor:pointer;white-space:nowrap;font-size:15px}
nav button[aria-current="page"]{background:var(--akz);border-color:var(--akz);color:var(--akz-ink)}
nav .zahl{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--rot);color:#fff;font-size:13px;text-align:center}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.karte h2{font-size:22px;margin-bottom:8px}
.karte h3{font-size:18px;margin:6px 0}
.mut{color:var(--mut)}
.klein{font-size:14px}
.reihe{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.raster{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.kpi{background:var(--karte2);border:1px solid var(--linie);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px}
.kpi span{color:var(--mut);font-size:14px}
.knopf{min-height:44px;padding:6px 14px;border-radius:10px;border:1.5px solid var(--linie);background:var(--karte2);font-weight:700;cursor:pointer}
.knopf:hover{border-color:var(--akz)}
.knopf.haupt{background:var(--akz);border-color:var(--akz);color:var(--akz-ink)}
.knopf.gut{background:var(--gut);border-color:var(--gut);color:#fff}
.knopf.rot{color:var(--rot);border-color:var(--rot)}
.knopf:disabled{opacity:.45;cursor:not-allowed}
label.feld{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mut);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{min-height:44px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--linie);background:var(--karte);color:var(--ink);font-size:16px;max-width:100%}
textarea{min-height:70px;width:100%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--akz);flex:0 0 auto}
.zeile{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-top:1px solid var(--linie);padding:10px 0}
.zeile:first-of-type{border-top:none}
.zeile .name{font-weight:700;flex:1 1 220px;min-width:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--karte2);border:1px solid var(--linie);white-space:nowrap}
.b-neu{background:var(--karte2)} .b-entwurf{background:var(--blau-soft);color:var(--blau)} .b-ausgewaehlt,.b-freigegeben{background:var(--akz-soft);color:var(--akz)}
.b-versendet,.b-gescannt{background:var(--warn-soft);color:var(--warn)} .b-kaufen,.b-aenderung,.b-kontrolle,.b-abnahme,.b-zahlung{background:var(--blau-soft);color:var(--blau)}
.b-bezahlt,.b-abgeschlossen{background:var(--gut-soft);color:var(--gut)} .b-absage{background:var(--rot-soft);color:var(--rot)}
.b-klaer{background:var(--rot);color:#fff;border-color:var(--rot)} .b-demo{background:transparent;border-style:dashed;color:var(--mut)}
.leer{color:var(--mut);font-style:italic;padding:8px 0}
details summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.zwei{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.trichter{display:flex;flex-direction:column;gap:6px}
.trichter div{display:flex;align-items:center;gap:10px;font-size:15px}
.trichter i{display:block;height:20px;border-radius:6px;background:var(--akz);min-width:4px}
.trichter span{flex:0 0 190px;color:var(--mut)}
@media (max-width:560px){ .trichter span{flex-basis:120px} }
/* Video-Entwurf: Hochformat 9:16 */
.phone{position:relative;width:min(100%,230px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#111;color:#fff;border:6px solid #222;box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:var(--f-display)}
.phone .szene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;opacity:0;transition:opacity .45s}
.phone .szene.an{opacity:1}
.phone .gross{font-size:30px;font-weight:800;line-height:1.05}
.phone .mittel{font-size:19px;font-weight:700;line-height:1.15}
.phone .zeichen{position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:30px 40px;align-content:center;justify-content:center;transform:rotate(-30deg);pointer-events:none;opacity:.22;font:800 22px var(--f-display);color:#fff;letter-spacing:2px}
.phone .fort{position:absolute;left:0;bottom:0;height:4px;background:#fff;opacity:.8}
.phone .play{position:absolute;right:8px;bottom:10px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.phone .chip{display:inline-block;margin:4px 3px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-size:14px}
.phone .hop{animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){ .phone .hop{animation:none} .phone .szene{transition:none} }
/* Brief */
.brief{background:#fff;color:#111;border:1px solid #ccc;border-radius:4px;padding:28px 34px;max-width:720px;font-family:var(--f-body);font-size:15px;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.brief .absz{font-size:11px;color:#555;border-bottom:1px solid #999;display:inline-block;margin-bottom:6px}
.brief .kopf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brief .qr{width:110px;height:110px;border:2px dashed #888;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#555;flex:0 0 auto}
.brief .paket{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin:6px 0}
.brief h3{font-family:var(--f-body);font-size:16px}
.warnung{background:var(--warn-soft);color:var(--ink);border-left:5px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.fehler{background:var(--rot-soft);border-left:5px solid var(--rot);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.ok{background:var(--gut-soft);border-left:5px solid var(--gut);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.protokoll li{padding:4px 0;border-bottom:1px solid var(--linie);font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.theme-toggle{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:15;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--linie);background:var(--karte);color:var(--ink);font-weight:700;cursor:pointer}
table.aus{width:100%;border-collapse:collapse;font-size:15px}
table.aus th,table.aus td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linie)}
.tabwrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Azubi-Recruiting Dashboard</h1>
    <div class="unter">Recruiting-Videos für Handwerksbetriebe im Saarland · Übersicht und Steuerzentrale</div>
  </header>
  <div class="hinweisband">🔒 Alle Daten bleiben <b>nur in diesem Browser</b> auf diesem Gerät. Hier <b>keine Passwörter oder Zugangsschlüssel</b> eingeben. Sicherung: Einstellungen → „Daten exportieren“.</div>
  <nav id="nav" aria-label="Bereiche"></nav>
  <main id="inhalt"></main>
</div>

<script>
(function(){
'use strict';
const KEY='azubi-recruiting-dashboard';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heute=()=>new Date().toISOString().slice(0,10);
const tageSeit=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):null;
const euro=n=>(isFinite(n)?(+n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}):'–');
const neueId=()=>Math.random().toString(36).slice(2,9);

// ---------- Daten ----------
const LEER={einstellungen:{gewerk:'Elektro',region:'Saarland',anzahl:20,preisX:'',preisY:'',preisZ:'',porto:0.95,tagesmenge:20,briefdienst:'',domain:'',hosting:'',mail:'',zahlung:'',absenderName:'',absenderAdresse:'',testbrief:false},
  checkliste:{},firmen:[],sperrliste:[],auftraege:[],protokoll:[]};
let D; try{ D=Object.assign(structuredClone(LEER),JSON.parse(localStorage.getItem(KEY)||'{}')); D.einstellungen=Object.assign(structuredClone(LEER.einstellungen),D.einstellungen); }catch(e){ D=structuredClone(LEER); }
function speichern(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ toast('⚠ Speichern nicht möglich – Speicher voll oder gesperrt'); } }
function log(was,firma,wer){ D.protokoll.unshift({t:new Date().toISOString(),wer:wer||'Mensch',was,firma:firma||''}); if(D.protokoll.length>2000) D.protokoll.length=2000; }
const firma=id=>D.firmen.find(f=>f.id===id);

const STATUS={neu:'Neu (recherchiert)',entwurf:'Video-Entwurf fertig',ausgewaehlt:'Für Brief ausgewählt',freigegeben:'Brief freigegeben',versendet:'Brief versendet',gescannt:'QR gescannt',
  kaufen:'Will so kaufen',aenderung:'Will Änderungen',kontrolle:'Geänderte Version zur Kontrolle',abnahme:'Abnahme angefragt',zahlung:'Bezahllink verschickt',bezahlt:'Bezahlt',abgeschlossen:'Abgeschlossen',absage:'Absage'};
const REIHE=Object.keys(STATUS);
const badge=f=>'<span class="badge b-'+f.status+'">'+esc(STATUS[f.status]||f.status)+'</span>'+(f.klaerung?' <span class="badge b-klaer">❗ Klärung nötig</span>':'')+(f.demo?' <span class="badge b-demo">Testdaten</span>':'');

const GEWERKE={
  'Elektro':{beruf:'Elektroniker/in für Energie- und Gebäudetechnik',leist:['Elektroinstallation','Smart Home','Photovoltaik','E-Ladestationen'],farben:['#1d4e89','#f2b705']},
  'SHK':{beruf:'Anlagenmechaniker/in für Sanitär-, Heizungs- und Klimatechnik',leist:['Wärmepumpen','Badsanierung','Heizungsbau','Lüftung'],farben:['#0e6e6e','#e8562a']},
  'Tischler':{beruf:'Tischler/in',leist:['Möbelbau','Innenausbau','Fenster & Türen','CNC-Fertigung'],farben:['#6b4226','#e9c46a']},
  'Dachdecker':{beruf:'Dachdecker/in',leist:['Steildach','Flachdach','Dachfenster','Solardächer'],farben:['#7a1f1f','#d9d9d9']},
  'Kfz':{beruf:'Kfz-Mechatroniker/in',leist:['Inspektion','E-Autos','Diagnose','Reifenservice'],farben:['#222831','#e63946']},
  'Maler':{beruf:'Maler/in und Lackierer/in',leist:['Fassaden','Innenräume','Kreative Techniken','Bodenbeläge'],farben:['#3a0ca3','#f72585']}};

// ---------- Sperrliste ----------
const norm=s=>String(s||'').toLowerCase().replace(/gmbh|ug|e\.k\.|kg|\(demo\)|[^a-z0-9äöüß]/g,'');
function gesperrt(name,ort){ const n=norm(name); return D.sperrliste.find(s=>norm(s.name)===n&&(!s.ort||!ort||norm(s.ort)===norm(ort))); }
function sperren(f,grund){ if(!gesperrt(f.name,f.ort)) D.sperrliste.push({id:neueId(),name:f.name,ort:f.ort||'',grund,datum:heute()}); log('Auf Sperrliste gesetzt ('+grund+')',f.name); }

// ---------- Bereiche ----------
const BEREICHE=[['uebersicht','🏠 Übersicht'],['recherche','🔎 Recherche'],['firmen','🏢 Firmen'],['videos','🎬 Video-Entwürfe'],['brief','✉️ Briefversand'],
  ['tracking','📈 Tracking'],['interesse','🙋 Interessierte Firmen'],['aenderungen','✏️ Änderungen'],['zahlung','💶 Abnahme & Zahlung'],
  ['sperrliste','⛔ Sperrliste'],['auswertung','📊 Auswertung'],['protokoll','📜 Protokoll'],['einstellungen','⚙️ Einstellungen & Start']];
let aktiv='uebersicht'; try{ aktiv=localStorage.getItem(KEY+'-tab')||'uebersicht'; }catch(e){}
if(location.hash&&BEREICHE.some(b=>b[0]===location.hash.slice(1))) aktiv=location.hash.slice(1);

function offeneAufgaben(){
  const F=D.firmen;
  return {auswahl:F.filter(f=>f.status==='entwurf').length, brief:F.filter(f=>f.status==='ausgewaehlt').length,
    kontrolle:F.filter(f=>f.status==='kontrolle').length, klaer:F.filter(f=>f.klaerung).length, nachfass:nachfassListe().length};
}
function nachfassListe(){ return D.firmen.filter(f=>f.status==='gescannt'&&!f.antwort&&(f.briefe||[]).length===1&&tageSeit(f.briefe[0].datum)>=14&&!f.nachfassVorschlag); }

function navZeigen(){
  const o=offeneAufgaben(), z={brief:o.brief+o.auswahl,aenderungen:o.kontrolle,firmen:o.klaer,tracking:o.nachfass};
  $('#nav').innerHTML=BEREICHE.map(([id,t])=>'<button data-tab="'+id+'"'+(id===aktiv?' aria-current="page"':'')+'>'+t+(z[id]?'<span class="zahl">'+z[id]+'</span>':'')+'</button>').join('');
}
function zeigen(){ navZeigen(); $('#inhalt').innerHTML=(SEITEN[aktiv]||SEITEN.uebersicht)(); nachZeigen(); }
let nachZeigen=()=>{};

// ---------- Seiten ----------
const SEITEN={};
SEITEN.uebersicht=()=>{
  const F=D.firmen, o=offeneAufgaben(), E=D.einstellungen;
  const ang=F.filter(f=>(f.briefe||[]).length).length, antw=F.filter(f=>f.antwort).length, kauf=F.filter(f=>['bezahlt','abgeschlossen'].includes(f.status)).length;
  const umsatz=F.reduce((a,f)=>a+(f.zahlung&&f.zahlung.bezahlt?+f.zahlung.betrag||0:0),0);
  const max=Math.max(1,...REIHE.map(s=>F.filter(f=>f.status===s).length));
  const ch=CHECK.filter(([k])=>D.checkliste[k]).length;
  let h='<div class="karte"><h2>Auf einen Blick</h2><div class="raster">'+
    [['Firmen',F.length],['Angeschrieben',ang],['Antworten',antw+(ang?' ('+Math.round(antw/ang*100)+' %)':'')],['Verkauft',kauf],['Umsatz',euro(umsatz)],['Gesperrt',D.sperrliste.length]].map(([t,v])=>'<div class="kpi"><b>'+esc(v)+'</b><span>'+t+'</span></div>').join('')+'</div></div>';
  const auf=[];
  if(o.auswahl) auf.push(['brief','✅ Freigabe 1: '+o.auswahl+' Firma/Firmen mit fertigem Entwurf – auswählen, wer einen Brief bekommt']);
  if(o.brief) auf.push(['brief','✅ Freigabe 2: '+o.brief+' Brief(e) prüfen und freigeben']);
  if(o.kontrolle) auf.push(['aenderungen','✅ Freigabe 3: '+o.kontrolle+' geänderte(s) Video(s) kontrollieren']);
  if(o.klaer) auf.push(['firmen','❗ '+o.klaer+' Firma/Firmen: Klärung nötig']);
  if(o.nachfass) auf.push(['tracking','📮 '+o.nachfass+' Nachfassbrief(e) vorgeschlagen (QR gescannt, keine Antwort seit 14 Tagen)']);
  h+='<div class="zwei"><div class="karte"><h2>Wartet auf dich</h2>'+(auf.length?auf.map(([t,x])=>'<div class="zeile"><span class="name">'+esc(x)+'</span><button class="knopf" data-tab="'+t+'">Öffnen →</button></div>').join(''):'<p class="leer">Gerade ist nichts zu tun. 🎉</p>')+'</div>'+
    '<div class="karte"><h2>Ablauf (Status der Firmen)</h2><div class="trichter">'+REIHE.map(s=>{ const n=F.filter(f=>f.status===s).length; return '<div><span>'+esc(STATUS[s])+'</span><i style="width:'+(n/max*55)+'%"></i><b>'+n+'</b></div>'; }).join('')+'</div></div></div>';
  h+='<div class="zwei"><div class="karte"><h2>Start-Checkliste</h2><p>'+ch+' von '+CHECK.length+' Punkten erledigt.</p>'+(ch<CHECK.length?'<p class="warnung">Vor dem ersten echten Brief müssen alle Punkte erledigt sein – und ein Testbrief an die eigene Adresse.</p>':'<p class="ok">Alles bereit.</p>')+'<button class="knopf" data-tab="einstellungen">Checkliste öffnen →</button></div>'+
    '<div class="karte"><h2>Verbindliche Regeln</h2><details><summary>Regeln anzeigen</summary><ul class="klein">'+REGELN.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></details>'+
    '<p class="klein mut">Gewerk: <b>'+esc(E.gewerk)+'</b> · Region: <b>'+esc(E.region)+'</b> · Tagesmenge: <b>'+esc(E.tagesmenge)+'</b></p></div></div>';
  return h;
};
const REGELN=['Erstkontakt nur per Brief – keine Kaltakquise per E-Mail, Telefon-Bot oder Social Media. Per E-Mail nur antworten, wenn sich die Firma selbst meldet.',
  'Vor jeder Recherche und jedem Versand gegen die Sperrliste prüfen. Absagen, Widerspruch, „keine Werbung“ → sofort und dauerhaft sperren.',
  'Keine Fotos, Videos, Grafiken, Logos oder wörtlichen Texte von der Website. Nur Fakten: Name, Gewerk, Ort, Leistungen, Ausbildungsberufe, Farben.',
  'Bilder, Animation, Sprechertext und Musik selbst erzeugen oder lizenziert. Logo und echte Fotos nur, wenn der Betrieb sie selbst schickt.',
  'Brief klar als unverbindliches Angebot – niemals wie eine Rechnung.',
  'Entwürfe nicht öffentlich: nur über individuellen Link/QR-Code, noindex, immer mit Wasserzeichen. Saubere Version erst nach Zahlung.',
  'Jede Landingpage mit Impressum und Datenschutzerklärung.',
  'Drei Freigaben durch den Menschen: Auswahl der Firmen, Briefe vor dem Versand, geänderte Videos vor dem Versand.',
  'Höchstens ein Nachfassbrief. Bei Unsicherheit „Klärung nötig“ markieren statt raten. Zugangsdaten nie im Code.'];

SEITEN.recherche=()=>{ const E=D.einstellungen;
  return '<div class="karte"><h2>🔎 Recherche starten</h2><p>Sucht Handwerksbetriebe mit Website. Gesperrte Firmen und Firmen mit vorhandenem Recruiting- oder Imagevideo werden aussortiert. Von der Website werden <b>nur Fakten</b> gesammelt.</p>'+
  '<div class="reihe"><label class="feld">Anzahl Firmen<input type="number" id="rAnzahl" min="1" max="200" value="'+esc(E.anzahl)+'"></label>'+
  '<label class="feld">Gewerk<select id="rGewerk">'+Object.keys(GEWERKE).map(g=>'<option'+(g===E.gewerk?' selected':'')+'>'+g+'</option>').join('')+'</select></label>'+
  '<label class="feld">Region<input type="text" id="rRegion" value="'+esc(E.region)+'"></label></div>'+
  '<div class="reihe" style="margin-top:10px"><button class="knopf haupt" data-act="recherche">▶ Starte Recherche</button><button class="knopf" data-act="demo">🧪 Testdaten erzeugen</button></div>'+
  '<p class="klein mut">„Starte Recherche“ legt einen Auftrag für den KI-Agenten an. Der Agent sucht die Firmen und spielt sie über „Firmen importieren“ ein. „Testdaten erzeugen“ legt erfundene Beispielfirmen an, um den Ablauf auszuprobieren.</p></div>'+
  '<div class="karte"><h2>Aufträge an den Agenten</h2>'+(D.auftraege.length?D.auftraege.slice().reverse().map(a=>'<div class="zeile"><span class="name">'+esc(a.art)+' · '+esc(a.param)+'</span><span class="mut klein">'+esc(a.datum)+'</span><span class="badge '+(a.status==='erledigt'?'b-bezahlt':'b-versendet')+'">'+esc(a.status)+'</span>'+(a.status!=='erledigt'?'<button class="knopf" data-act="auftragFertig" data-id="'+a.id+'">Erledigt</button>':'')+'</div>').join(''):'<p class="leer">Noch keine Aufträge.</p>')+'</div>'+
  '<div class="zwei"><div class="karte"><h2>Firma von Hand anlegen</h2>'+firmaFormular()+'<button class="knopf haupt" data-act="firmaNeu">＋ Firma anlegen</button></div>'+
  '<div class="karte"><h2>Firmen importieren (vom Agenten)</h2><p class="klein">JSON-Liste mit Feldern: name, gewerk, ort, plz, strasse, ansprech, website, leistungen, berufe, farbe1, farbe2.</p><textarea id="importText" rows="6" placeholder="[{&quot;name&quot;:&quot;…&quot;}]"></textarea><div class="reihe"><button class="knopf haupt" data-act="import">⬆ Importieren</button></div></div></div>';
};
function firmaFormular(){ const g=Object.keys(GEWERKE);
  return '<div class="raster" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))">'+
  [['nName','Firmenname'],['nOrt','Ort'],['nPlz','PLZ'],['nStrasse','Straße und Nr.'],['nAnsprech','Ansprechpartner/Inhaber (aus Impressum)'],['nWeb','Website']].map(([i,t])=>'<label class="feld">'+t+'<input type="text" id="'+i+'"></label>').join('')+
  '<label class="feld">Gewerk<select id="nGewerk">'+g.map(x=>'<option>'+x+'</option>').join('')+'</select></label></div>';
}

SEITEN.firmen=()=>{
  const F=D.firmen; if(!F.length) return '<div class="karte"><h2>🏢 Firmen</h2><p class="leer">Noch keine Firmen. Unter „Recherche“ starten oder Testdaten erzeugen.</p></div>';
  return '<div class="karte"><h2>🏢 Firmen ('+F.length+')</h2><div class="reihe"><label class="feld">Filter<select id="fFilter"><option value="">Alle</option><option value="klaer">❗ Klärung nötig</option>'+REIHE.map(s=>'<option value="'+s+'">'+esc(STATUS[s])+'</option>').join('')+'</select></label></div><div id="fListe"></div></div>';
};
function firmenListe(filter){
  const F=D.firmen.filter(f=>!filter||(filter==='klaer'?f.klaerung:f.status===filter));
  return F.length?F.map(f=>'<details class="zeile" style="display:block"><summary><span class="name">'+esc(f.name)+'</span>&nbsp;<span class="mut klein">'+esc(f.gewerk)+' · '+esc(f.ort)+'</span>&nbsp; '+badge(f)+'</summary>'+
    '<div class="raster" style="margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))">'+
    [['name','Firmenname'],['ort','Ort'],['plz','PLZ'],['strasse','Straße'],['ansprech','Ansprechpartner'],['website','Website'],['berufe','Ausbildungsberufe'],['leistungen','Leistungen (Komma)']].map(([k,t])=>'<label class="feld">'+t+'<input type="text" data-feld="'+k+'" data-id="'+f.id+'" value="'+esc(Array.isArray(f[k])?f[k].join(', '):f[k])+'"></label>').join('')+
    '<label class="feld">Farbe 1<input type="color" data-feld="farbe1" data-id="'+f.id+'" value="'+esc(f.farbe1||'#1d4e89')+'"></label><label class="feld">Farbe 2<input type="color" data-feld="farbe2" data-id="'+f.id+'" value="'+esc(f.farbe2||'#f2b705')+'"></label></div>'+
    '<label class="feld" style="margin-top:8px">Notizen<textarea data-feld="notiz" data-id="'+f.id+'">'+esc(f.notiz)+'</textarea></label>'+
    '<div class="reihe" style="margin-top:8px"><label class="feld">Status<select data-feld="status" data-id="'+f.id+'">'+REIHE.map(s=>'<option value="'+s+'"'+(s===f.status?' selected':'')+'>'+esc(STATUS[s])+'</option>').join('')+'</select></label>'+
    '<button class="knopf" data-act="klaer" data-id="'+f.id+'">'+(f.klaerung?'✓ Klärung erledigt':'❗ Klärung nötig')+'</button><button class="knopf rot" data-act="sperren" data-id="'+f.id+'">⛔ Sperren</button><button class="knopf rot" data-act="loeschen" data-id="'+f.id+'">🗑 Löschen</button></div></details>').join(''):'<p class="leer">Keine Firmen in diesem Filter.</p>';
}

SEITEN.videos=()=>{
  const F=D.firmen.filter(f=>f.status!=='absage').slice().sort((a,b)=>a.name.localeCompare(b.name,'de'));
  if(!F.length) return '<div class="karte"><h2>🎬 Video-Entwürfe</h2><p class="leer">Noch keine Firmen.</p></div>';
  return '<div class="karte"><h2>🎬 Video-Entwürfe</h2><p class="klein">Hochformat 9:16, ca. 20 Sekunden, immer mit Wasserzeichen „ENTWURF“. Eigene Gestaltung: Firmenname in den Firmenfarben, kein Logo, keine Originalbilder. Ist ein fertiges Video (z. B. aus Remotion) hochgeladen, hier die Adresse eintragen.</p></div><div class="raster">'+
  F.map(f=>'<div class="karte"><h3>'+esc(f.name)+'</h3><p class="klein mut">'+esc(f.gewerk)+' · '+esc(f.ort)+' · '+badge(f)+'</p>'+
    (f.video?(f.video.url?'<video class="phone" src="'+esc(f.video.url)+'" controls playsinline preload="metadata"></video>':'<div class="phone" data-vorschau="'+f.id+'"></div>')+'<p class="klein mut">Version '+f.video.version+' · erstellt '+esc(f.video.erstellt)+'</p>':'<p class="leer">Noch kein Entwurf.</p>')+
    '<div class="reihe">'+(f.video?'':'<button class="knopf haupt" data-act="entwurf" data-id="'+f.id+'">🎬 Entwurf erstellen</button>')+
    '<label class="feld" style="flex:1 1 100%">Video-Adresse (optional)<input type="url" data-feld="videoUrl" data-id="'+f.id+'" value="'+esc(f.video&&f.video.url)+'" placeholder="https://…/entwurf.mp4"></label></div></div>').join('')+'</div>';
};

SEITEN.brief=()=>{ const E=D.einstellungen;
  const wahl=D.firmen.filter(f=>['entwurf','ausgewaehlt'].includes(f.status));
  const frei=D.firmen.filter(f=>f.status==='freigegeben');
  const fehlt=[]; if(!E.preisX) fehlt.push('Preis X'); if(!E.preisY) fehlt.push('Preis Y'); if(!E.absenderName||!E.absenderAdresse) fehlt.push('Absender'); if(!E.domain) fehlt.push('Domain für den QR-Link');
  let h='<div class="karte"><h2>✉️ Briefversand</h2><p><b>Freigabe 1:</b> Häkchen bei den Firmen setzen, die einen Brief bekommen sollen. <b>Freigabe 2:</b> Brief in der Vorschau prüfen, dann „Freigeben &amp; versenden“.</p>'+
    (fehlt.length?'<p class="warnung">Noch offen: '+esc(fehlt.join(', '))+' (unter Einstellungen).</p>':'')+
    (!E.testbrief?'<p class="warnung">Vor dem ersten echten Versand: <b>Testbrief an die eigene Adresse</b> schicken. <button class="knopf" data-act="testbrief">✓ Testbrief ist angekommen</button></p>':'')+
    (wahl.length?wahl.map(f=>'<div class="zeile"><input type="checkbox" data-act="waehle" data-id="'+f.id+'" id="w'+f.id+'"'+(f.status==='ausgewaehlt'?' checked':'')+(gesperrt(f.name,f.ort)?' disabled':'')+'><label class="name" for="w'+f.id+'">'+esc(f.name)+' <span class="mut klein">'+esc(f.ort)+'</span></label>'+badge(f)+(gesperrt(f.name,f.ort)?'<span class="badge b-absage">gesperrt</span>':'')+'<button class="knopf" data-act="vorschau" data-id="'+f.id+'">👁 Briefvorschau</button></div>').join(''):'<p class="leer">Keine Firma mit fertigem Entwurf. Erst unter „Video-Entwürfe“ einen Entwurf erstellen.</p>')+
    '<div class="reihe" style="margin-top:10px"><button class="knopf haupt" data-act="freigeben"'+(D.firmen.some(f=>f.status==='ausgewaehlt')&&!fehlt.length&&E.testbrief&&alleCheck()?'':' disabled')+'>✅ Freigeben &amp; versenden</button><span class="klein mut">Kosten ca. '+euro((+E.porto||0)*D.firmen.filter(f=>f.status==='ausgewaehlt').length)+' ('+euro(E.porto)+' je Brief)</span></div>'+
    (!alleCheck()?'<p class="klein mut">Der Knopf geht erst, wenn die Start-Checkliste komplett ist.</p>':'')+'</div>';
  h+='<div class="karte"><h2>Freigegeben – wartet auf Versand</h2>'+(frei.length?frei.map(f=>'<div class="zeile"><span class="name">'+esc(f.name)+'</span><span class="klein mut">freigegeben '+esc(f.freigabeDatum)+'</span><button class="knopf" data-act="versendet" data-id="'+f.id+'">📮 Als versendet markieren</button></div>').join(''):'<p class="leer">Nichts in der Warteschlange.</p>')+
    '<p class="klein mut">Versand über '+esc(E.briefdienst||'Briefdienst (Pingen / LetterXpress – noch nicht gewählt)')+'. Solange die Schnittstelle nicht eingerichtet ist, legt die Freigabe einen Versandauftrag an.</p></div>';
  h+='<div class="karte"><h2>Briefvorschau</h2><div id="briefBox"><p class="leer">„👁 Briefvorschau“ bei einer Firma antippen.</p></div></div>';
  return h;
};
function briefHtml(f,nachfass){ const E=D.einstellungen, X=+E.preisX, Y=+E.preisY;
  const link=(E.domain||'ihre-domain.de').replace(/^https?:\/\//,'').replace(/\/$/,'')+'/v/'+(f.code||'xxxxxx');
  return '<div class="brief"><div class="kopf"><div><div class="absz">'+esc(E.absenderName||'Absender')+' · '+esc((E.absenderAdresse||'Adresse').replace(/\n/g,' · '))+'</div><div>'+esc(f.name)+'<br>'+(f.ansprech?esc(f.ansprech)+'<br>':'')+esc(f.strasse||'Straße')+'<br>'+esc((f.plz||'PLZ')+' '+(f.ort||''))+'</div></div><div class="klein">'+esc(new Date().toLocaleDateString('de-DE'))+'</div></div>'+
  '<h3>'+(nachfass?'Kurze Erinnerung: ':'')+'Unverbindliches Angebot: Ihr eigenes Azubi-Video für TikTok, Instagram und Facebook</h3>'+
  '<p>'+(f.ansprech?'Guten Tag '+esc(f.ansprech)+',':'Sehr geehrte Damen und Herren,')+'</p>'+
  (nachfass?'<p>vor einiger Zeit habe ich Ihnen einen Entwurf für ein Recruiting-Video geschickt. Falls Sie noch keine Zeit hatten: Der Entwurf ist weiterhin für Sie abrufbar.</p>':
  '<p>junge Leute suchen ihre Ausbildung heute dort, wo sie sowieso unterwegs sind: auf TikTok, Instagram und Facebook. Für <b>'+esc(f.name)+'</b> habe ich deshalb einen kurzen Entwurf eines Recruiting-Videos im Hochformat erstellt – passend zu Ihrem Gewerk und zur Ausbildung als '+esc(f.berufe||'Azubi')+'.</p>')+
  '<div class="reihe" style="align-items:flex-start;gap:16px"><div class="qr">QR-Code<br>zu Ihrem Entwurf</div><div><p style="margin-top:0">Scannen Sie einfach den QR-Code mit dem Handy – oder öffnen Sie <b>'+esc(link)+'</b>. Der Entwurf ist nur für Sie sichtbar.</p></div></div>'+
  '<p><b>Wenn Ihnen das Video gefällt, gibt es zwei Möglichkeiten:</b></p>'+
  '<div class="paket"><b>„So übernehmen“</b> – das Video wie im Entwurf, ohne Wasserzeichen, in allen Formaten: '+(X?esc(euro(X)):'Preis folgt')+'</div>'+
  '<div class="paket"><b>„Mit Anpassung“</b> – wir bauen Ihr Logo, eigene Fotos und kurze Handy-Clips aus Ihrem Betrieb ein, eine Änderungsrunde inklusive: '+(X&&Y?esc(euro(X+Y)):'Preis folgt')+'</div>'+
  '<p>Dies ist ein <b>unverbindliches Angebot</b> und keine Rechnung. Sie gehen keinerlei Verpflichtung ein. Wenn Sie kein Interesse haben, wählen Sie auf der Seite einfach „Kein Interesse“ – dann schreibe ich Ihnen nicht mehr.</p>'+
  '<p>Mit freundlichen Grüßen<br>'+esc(E.absenderName||'Absender')+'</p><p class="klein" style="color:#555">Impressum und Datenschutz finden Sie auf der Seite zu Ihrem Entwurf.</p></div>';
}

SEITEN.tracking=()=>{
  const F=D.firmen.filter(f=>(f.briefe||[]).length);
  const nf=nachfassListe();
  return '<div class="karte"><h2>📈 Tracking</h2><p class="klein">Wer hat den QR-Code gescannt und das Video angesehen? Die Landingpage meldet das später automatisch – bis dahin hier von Hand eintragen.</p>'+
  (F.length?'<div class="tabwrap"><table class="aus"><thead><tr><th>Firma</th><th>Brief</th><th>Tage</th><th>QR gescannt</th><th>Video angesehen</th><th>Status</th></tr></thead><tbody>'+
   F.map(f=>'<tr><td><b>'+esc(f.name)+'</b></td><td>'+esc(f.briefe.map(b=>(b.art==='nachfass'?'Nachfass ':'')+b.datum).join(', '))+'</td><td>'+tageSeit(f.briefe[f.briefe.length-1].datum)+'</td>'+
    '<td>'+(f.scan?esc(f.scan):'<button class="knopf" data-act="scan" data-id="'+f.id+'">gescannt</button>')+'</td><td>'+(f.angesehen?esc(f.angesehen):'<button class="knopf" data-act="angesehen" data-id="'+f.id+'">angesehen</button>')+'</td><td>'+badge(f)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="leer">Noch keine Briefe versendet.</p>')+'</div>'+
  '<div class="karte"><h2>📮 Nachfassen (höchstens ein Nachfassbrief)</h2><p class="klein">Vorschlag für Firmen, die den QR-Code gescannt, aber nach 14 Tagen nicht reagiert haben. Auch hier gilt: erst Vorschau prüfen, dann freigeben.</p>'+
  (nf.length?nf.map(f=>'<div class="zeile"><span class="name">'+esc(f.name)+'</span><span class="klein mut">Brief vor '+tageSeit(f.briefe[0].datum)+' Tagen</span><button class="knopf" data-act="vorschauNf" data-id="'+f.id+'">👁 Vorschau</button><button class="knopf haupt" data-act="nachfass" data-id="'+f.id+'">✅ Nachfassbrief freigeben</button><button class="knopf" data-act="keinNf" data-id="'+f.id+'">Nicht nachfassen</button></div>').join(''):'<p class="leer">Gerade kein Nachfassbrief fällig.</p>')+'<div id="briefBox"></div></div>';
};

SEITEN.interesse=()=>{
  const offen=D.firmen.filter(f=>['versendet','gescannt'].includes(f.status));
  const spalte=(st,t,knopf)=>{ const L=D.firmen.filter(f=>f.antwort&&f.antwort.art===st&&!['bezahlt','abgeschlossen','absage'].includes(f.status));
    return '<div class="karte"><h2>'+t+' ('+L.length+')</h2>'+(L.length?L.map(f=>'<div class="zeile"><span class="name">'+esc(f.name)+'<br><span class="klein mut">'+esc(f.antwort.datum)+(f.antwort.text?' · „'+esc(f.antwort.text)+'“':'')+'</span></span>'+badge(f)+knopf(f)+'</div>').join(''):'<p class="leer">Noch niemand.</p>')+'</div>'; };
  return '<div class="karte"><h2>🙋 Antwort eintragen</h2><p class="klein">Formular- oder E-Mail-Antworten hier einsortieren. „Kein Interesse“ setzt die Firma <b>sofort</b> auf die Sperrliste. Unklare Antworten nicht raten – „Unklar“ markiert „Klärung nötig“.</p>'+
  (offen.length?'<div class="reihe"><label class="feld">Firma<select id="aFirma">'+offen.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select></label><label class="feld" style="flex:1 1 240px">Notiz / Wortlaut (kurz)<input type="text" id="aText"></label></div>'+
   '<div class="reihe" style="margin-top:8px"><button class="knopf gut" data-act="antwort" data-art="kaufen">👍 Will Video so kaufen</button><button class="knopf haupt" data-act="antwort" data-art="aendern">✏️ Will Änderungen</button><button class="knopf rot" data-act="antwort" data-art="absage">✋ Kein Interesse</button><button class="knopf" data-act="antwort" data-art="unklar">❓ Unklar</button></div>':'<p class="leer">Keine Firma wartet auf eine Antwort.</p>')+'</div>'+
  '<div class="zwei">'+spalte('kaufen','👍 Will Video so kaufen',f=>f.status==='kaufen'?'<button class="knopf haupt" data-act="bezahllink" data-id="'+f.id+'">💳 Bezahllink / Rechnung senden</button>':'')+
  spalte('aendern','✏️ Will Änderungen',f=>f.status==='aenderung'&&!f.formular?'<button class="knopf haupt" data-act="formular" data-id="'+f.id+'">📝 Änderungsformular schicken</button>':'')+'</div>';
};

SEITEN.aenderungen=()=>{
  const L=D.firmen.filter(f=>['aenderung','kontrolle'].includes(f.status));
  return '<div class="karte"><h2>✏️ Änderungen</h2><p class="klein">Eine Änderungsrunde ist inklusive, jede weitere kostet '+euro(+D.einstellungen.preisZ||NaN)+' extra. Logo, Fotos und Clips nur einbauen, wenn der Betrieb sie selbst geschickt hat.</p></div>'+
  (L.length?L.map(f=>{ const A=f.aenderungen||[];
    return '<div class="karte"><h3>'+esc(f.name)+'</h3><p>'+badge(f)+' <span class="klein mut">Runden: '+A.filter(a=>a.version).length+(A.filter(a=>a.version).length>1?' (extra)':'')+(f.formular?' · Formular geschickt '+esc(f.formular):'')+'</span></p>'+
    (A.length?'<ul>'+A.map(a=>'<li>'+esc(a.datum)+': '+esc(a.text)+(a.version?' → <b>Version '+a.version+'</b>'+(a.kontrolliert?' ✓ kontrolliert':''):'')+'</li>').join('')+'</ul>':'')+
    (f.status==='aenderung'?'<div class="reihe"><label class="feld" style="flex:1 1 300px">Neuer Änderungswunsch<input type="text" id="aw'+f.id+'" placeholder="z. B. Logo einbauen, Farbe dunkler, Text …"></label><button class="knopf" data-act="wunsch" data-id="'+f.id+'">＋ Eintragen</button><button class="knopf haupt" data-act="neueVersion" data-id="'+f.id+'"'+(A.some(a=>!a.version)?'':' disabled')+'>🎬 Neue Version erstellt</button></div>':
     '<div class="reihe"><div class="phone" data-vorschau="'+f.id+'" style="width:180px"></div><div><p><b>Freigabe 3:</b> Geänderte Version kontrollieren, dann an die Firma zur Abnahme schicken.</p><button class="knopf gut" data-act="kontrolliert" data-id="'+f.id+'">✅ Kontrolliert – zur Abnahme an die Firma</button> <button class="knopf" data-act="zurueck" data-id="'+f.id+'">↺ Nochmal überarbeiten</button></div></div>')+'</div>'; }).join(''):'<div class="karte"><p class="leer">Keine offenen Änderungen.</p></div>');
};

SEITEN.zahlung=()=>{
  const ab=D.firmen.filter(f=>f.status==='abnahme'), za=D.firmen.filter(f=>f.status==='zahlung'), fe=D.firmen.filter(f=>['bezahlt','abgeschlossen'].includes(f.status));

  '<div class="karte"><h2>Bezahllinks verschickt – Zahlung offen</h2>'+(za.length?za.map(f=>'<div class="zeile"><span class="name">'+esc(f.name)+'</span><span>'+euro(f.zahlung.betrag)+'</span><span class="klein mut">seit '+esc(f.zahlung.datum)+' ('+tageSeit(f.zahlung.datum)+' Tage)</span><button class="knopf gut" data-act="bezahlt" data-id="'+f.id+'">💶 Bezahlt</button></div>').join(''):'<p class="leer">Keine.</p>')+
  '<p class="klein mut">Zahlungsanbieter: '+esc(D.einstellungen.zahlung||'noch nicht gewählt (z. B. Stripe)')+'.</p></div>'+
  '<div class="karte"><h2>Bezahlt</h2>'+(fe.length?fe.map(f=>'<div class="zeile"><span class="name">'+esc(f.name)+'</span><span>'+euro(f.zahlung&&f.zahlung.betrag)+'</span>'+badge(f)+(f.status==='bezahlt'?'<button class="knopf haupt" data-act="ausliefern" data-id="'+f.id+'">📦 Saubere Version + Nutzungsrechte ausgeliefert</button>':'')+'</div>').join(''):'<p class="leer">Noch keine.</p>')+
  '<p class="klein mut">Nach Zahlungseingang: Video ohne Wasserzeichen in allen Formaten (TikTok, Instagram Reels, Facebook) und die Nutzungsrechte-Vereinbarung schicken.</p></div>';

// ---------- Video-Vorschau (selbst erzeugt, mit Wasserzeichen) ----------
function vorschauBauen(el,f){
  const G=GEWERKE[f.gewerk]||GEWERKE.Elektro, c1=f.farbe1||G.farben[0], c2=f.farbe2||G.farben[1];
  const leist=(Array.isArray(f.leistungen)?f.leistungen:String(f.leistungen||'').split(',')).map(s=>s.trim()).filter(Boolean).slice(0,3);
  const S=[[`linear-gradient(160deg,${c1},#111)`,'<div class="gross hop">Bock auf<br>Handwerk?</div>'],
    [`linear-gradient(200deg,${c2},${c1})`,'<div class="mittel" style="color:#fff;opacity:.85">'+esc(f.ort)+'</div><div class="gross" style="font-size:26px">'+esc(f.name)+'</div><div class="mittel">sucht Azubis!</div>'],
    [`linear-gradient(160deg,${c1},${c2})`,'<div class="mittel">Deine Ausbildung:</div><div class="gross" style="font-size:22px">'+esc(f.berufe||G.beruf)+'</div>'],
    [`linear-gradient(200deg,#111,${c1})`,'<div class="mittel">Bei uns lernst du:</div><div>'+(leist.length?leist:G.leist.slice(0,3)).map(l=>'<span class="chip">'+esc(l)+'</span>').join('')+'</div>'],
    [`linear-gradient(160deg,${c2},#111)`,'<div class="gross" style="font-size:26px">Team.<br>Technik.<br>Zukunft.</div>'],
    [`linear-gradient(200deg,${c1},${c2})`,'<div class="gross hop">Bewirb<br>dich jetzt!</div><div class="mittel" style="margin-top:8px">'+esc(f.name)+'</div>']];
  el.innerHTML=S.map(([bg,h],i)=>'<div class="szene'+(i?'':' an')+'" style="background:'+bg+'">'+h+'</div>').join('')+'<div class="zeichen" aria-hidden="true">'+'ENTWURF '.repeat(30)+'</div><div class="fort" style="width:0"></div><button class="play" aria-label="Entwurf abspielen">▶</button>';
  el.setAttribute('role','group'); el.setAttribute('aria-label','Video-Entwurf für '+f.name+' (mit Wasserzeichen)');
  const sz=el.querySelectorAll('.szene'), fort=el.querySelector('.fort'), kn=el.querySelector('.play'), DAUER=3.4, GES=DAUER*S.length;
  let t0=0, raf=0, lauf=false;
  const schritt=now=>{ const t=((now-t0)/1000)%GES, k=Math.floor(t/DAUER); sz.forEach((s,i)=>s.classList.toggle('an',i===k)); fort.style.width=(t/GES*100)+'%'; if(lauf&&el.isConnected) raf=requestAnimationFrame(schritt); };
  kn.onclick=()=>{ lauf=!lauf; kn.textContent=lauf?'⏸':'▶'; kn.setAttribute('aria-label',lauf?'Pause':'Entwurf abspielen'); if(lauf){ t0=performance.now(); raf=requestAnimationFrame(schritt); } else cancelAnimationFrame(raf); };
}

};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ aktiv=t.dataset.tab; try{ localStorage.setItem(KEY+'-tab',aktiv); }catch(x){} history.replaceState(null,'','#'+aktiv); zeigen(); window.scrollTo({top:0}); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.type==='checkbox') return;
  const r=AKT[a.dataset.act]&&AKT[a.dataset.act](a.dataset.id,a); if(r==='kein') return; speichern(); zeigen();
});
document.addEventListener('change',e=>{ const el=e.target;
  if(el.matches('input[type=checkbox][data-act]')){ AKT[el.dataset.act](el.dataset.id,el); speichern(); zeigen(); return; }
  if(el.dataset.check){ D.checkliste[el.dataset.check]=el.checked; log((el.checked?'✓ ':'✗ ')+'Checkliste: '+CHECK.find(c=>c[0]===el.dataset.check)[1]); speichern(); navZeigen(); return; }
  if(el.dataset.einstcheck){ D.einstellungen[el.dataset.einstcheck]=el.checked; log('Testbrief: '+(el.checked?'angekommen':'zurückgesetzt')); speichern(); return; }
  if(el.dataset.einst){ D.einstellungen[el.dataset.einst]=el.value; speichern(); return; }
  if(el.dataset.feld){ const f=firma(el.dataset.id); const k=el.dataset.feld;
    if(k==='videoUrl'){ f.video=f.video||{version:1,erstellt:heute()}; f.video.url=el.value.trim(); if(f.status==='neu') f.status='entwurf'; log('Video-Adresse eingetragen',f.name); speichern(); zeigen(); return; }
    if(k==='status'){ setStatus(f,el.value,'Status von Hand → '+STATUS[el.value]); if(el.value==='absage') sperren(f,'Absage'); speichern(); zeigen(); return; }
    f[k]=k==='leistungen'?el.value.split(',').map(s=>s.trim()).filter(Boolean):el.value; log('Daten geändert: '+k,f.name); speichern(); return; }
  if(el.id==='fFilter'){ $('#fListe').innerHTML=firmenListe(el.value); return; }
  if(el.id==='datei'){ const fl=el.files[0]; if(!fl) return; fl.text().then(txt=>{ try{ const j=JSON.parse(txt); if(!j||!Array.isArray(j.firmen)) throw 0; if(!confirm('Alle aktuellen Daten durch die Datei ersetzen?')) return;
      D=Object.assign(structuredClone(LEER),j); D.einstellungen=Object.assign(structuredClone(LEER.einstellungen),j.einstellungen); log('Daten aus Datei importiert'); speichern(); zeigen(); toast('Daten importiert'); }catch(x){ toast('Diese Datei passt nicht'); } }); el.value=''; }
});
nachZeigen=()=>{ if(aktiv==='firmen'&&$('#fListe')) $('#fListe').innerHTML=firmenListe('');
  document.querySelectorAll('[data-vorschau]').forEach(el=>{ const f=firma(el.dataset.vorschau); if(f) vorschauBauen(el,f); }); };

let tT=0; function toast(t){ let e=$('.toast'); if(!e){ e=document.createElement('div'); e.className='toast'; e.setAttribute('role','status'); document.body.appendChild(e); } e.textContent=t; e.hidden=false; clearTimeout(tT); tT=setTimeout(()=>e.hidden=true,3000); }
zeigen();
})();
</script>
</body>
</html>
