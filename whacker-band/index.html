<style>
  :root{--bg:#0b1020;--karte:#141c33;--linie:#2b3a62;--text:#f2f5fb;--mut:#aab6d3;--gold:#ffd23f;
        --sw1:#e5484d;--sw2:#f08c2e;--sw3:#f2cf3a;--sw4:#46b37b;--sw5:#3f8ee8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  .wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:4px solid var(--gold);outline-offset:2px}
  .top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
  .top h1{margin:0;font-size:26px;flex:1;min-width:200px;display:flex;align-items:center;gap:10px}

  #spielart button{min-height:50px;font-size:17px}

  .knopf{min-height:46px;padding:6px 14px;border-radius:10px;border:1px solid var(--linie);background:#0f1730;font-weight:700;cursor:pointer;font-size:16px}

  #band span{flex:0 0 auto;width:56px;height:56px;border-radius:50%;opacity:.9;transition:transform .15s,opacity .15s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  #band span.jetzt{opacity:1;transform:scale(1.28);box-shadow:0 0 0 5px #fff,0 0 22px 6px rgba(255,255,255,.45)}
  #band span.fertig{opacity:.3}
  @media (max-width:700px){#band span{width:40px;height:40px}#band{min-height:70px;gap:9px}}
  .hinweis{color:var(--mut);font-size:16px;margin:0}
  .panel{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

  #klavier .w,#klavier .s{position:absolute;top:0;border-radius:0 0 8px 8px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-weight:700;font-size:14px;padding-bottom:6px}
  #klavier .w{height:150px;background:#f5f6fa;color:#333;border:1px solid #999}
  #klavier .s{height:92px;background:#1b1f2a;color:#ddd;z-index:2;font-size:11px}

  .liste{display:flex;flex-direction:column;gap:6px}
  .liste .eintrag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--linie);padding-top:6px}

<div class="wrap">
  <div class="top">
    <h1><img src="icons/icon.svg" alt="" width="44" height="44" style="border-radius:11px"> SoundWhacker Band</h1>
    <div class="modi" role="group" aria-label="Modus">
      <button data-m="vor" aria-pressed="true">▶ Vorspielen</button>
      <button data-m="mit" aria-pressed="false">🙌 Mitspielen</button>
      <button data-m="auf" aria-pressed="false">● Lied einspielen</button>
    </div>
    <button class="knopf" id="vollbild" title="Vollbild für den Beamer">⛶ Vollbild</button>
    <a href="../app.html?id=whacker-band">Anleitung</a>

  <div class="leiste">
    <label>Lied <select id="lied"></select></label>

  </div>

    <div class="modi" id="spielart" role="group" aria-label="Spielart beim Mitspielen">

      <button data-s="reihe" title="SW1 → SW2 → SW3 … – wer nicht dran ist, bleibt stumm">🔢 Feste SW-Reihenfolge</button>

    <div class="zeile" id="reiheZeile" hidden><span class="hinweis">Mitspieler:</span>
      <button class="knopf" data-n="2">SW1–2</button><button class="knopf" data-n="3">SW1–3</button><button class="knopf" data-n="4">SW1–4</button><button class="knopf" data-n="5">SW1–5</button></div>
  </div>
  <div id="band" aria-hidden="true"></div>
  <div class="buehne" id="buehne">

  <!-- Lied einspielen -->

    <h2>● Eigenes Lied einspielen</h2>
    <p class="hinweis">Mit den SoundWhackern (Tasten 1–5) oder auf der Klaviatur spielen. Die App merkt sich Reihenfolge und Rhythmus.</p>
    <div class="zeile">

      <button class="gross" id="recSpeichern">💾 Speichern</button>
    </div>
  </div>

  <!-- Meine Lieder -->
  <div class="panel" id="meinePanel" hidden>
    <h2>💾 Meine Lieder</h2>
    <div class="zeile">
      <button class="knopf" id="alleLaden">⬇ Alle herunterladen</button>

    <div class="liste" id="meineListe"></div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const FARBE=['#e5484d','#f08c2e','#f2cf3a','#46b37b','#3f8ee8'];
const NAMEN=['c','cis','d','dis','e','f','fis','g','gis','a','b','h'];
function tonName(m){ const o=Math.floor(m/12)-1, n=NAMEN[((m%12)+12)%12]; return o>=4? n+['′','″','‴','⁗'][o-4] : (o===3? n : n[0].toUpperCase()+n.slice(1)); }
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }

// ---------- Einstellungen ----------
const KEY='whacker-band', LKEY='whacker-band-lieder';
let st={lied:'lied:freude',tempo:100,aufstellung:'halbkreis',klang:'marimba',modus:'vor',spielart:'fest',reiheN:5};
try{ Object.assign(st, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const merke=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };

// ---------- Klang: Instrumente der Tischharfe ----------
const ST_TOENE=[54,57,60,63,66,69,72,75,78,81];
const KLAENGE={
  marimba:{n:'Marimba',pegel:.96}, klavier:{n:'Klavier',pegel:.84}, vibraphon:{n:'Vibraphon',pegel:.68}, xylophon:{n:'Xylophon',pegel:2.18},
  spieluhr:{n:'Spieluhr',pegel:1.12}, kalimba:{n:'Kalimba',pegel:1.31}, steeldrums:{n:'Steeldrums',pegel:1.34}, epiano:{n:'E-Piano',pegel:.4},
  gitarre:{n:'Gitarre',pegel:1.36}, koto:{n:'Koto',pegel:2.2},
  overdrive:{n:'Verzerrte Gitarre (Overdrive)',pegel:.46}, distortion:{n:'Verzerrte Gitarre (Distortion)',pegel:.46},
  feedback:{n:'Verzerrte Gitarre (Feedback)',pegel:.45}, wah:{n:'Wah-Wah-Gitarre',pegel:.52},
  harfe:{n:'Harfe',pegel:1.05,pfad:'../tischharfe/samples/',toene:{E3:52,G3:55,B3:59,D4:62,F4:65,A4:69,C5:72,E5:76,G5:79,B5:83}},
};
for(const id in KLAENGE){ const K=KLAENGE[id]; if(!K.pfad){ K.pfad='../tischharfe/klaenge/'+id+'/'; K.toene=Object.fromEntries(ST_TOENE.map(m=>[m,m])); } }
let ctx=null, master, dry, wet; const puffer={}, lade={};
function audio(){
  if(ctx){ if(ctx.state!=='running') ctx.resume(); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=3; comp.attack.value=.003; comp.release.value=.2;
  master=ctx.createGain(); master.gain.value=.9; master.connect(comp); comp.connect(ctx.destination);
  dry=ctx.createGain(); wet=ctx.createGain(); dry.gain.value=.9; wet.gain.value=.2; dry.connect(master); wet.connect(master);
  const conv=ctx.createConvolver(), sr=ctx.sampleRate, n=Math.floor(sr*2.2), b=ctx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); }
  conv.buffer=b; conv.connect(wet); wet._in=conv;
  ladeKlang(st.klang);
}
async function ladeKlang(id){
  const K=KLAENGE[id]; if(!K||!ctx||lade[id]) return; lade[id]='laedt'; const b={};
  try{ await Promise.all(Object.entries(K.toene).map(async([name,midi])=>{ const r=await fetch(K.pfad+name+'.mp3'); if(!r.ok) throw 0; const ab=await r.arrayBuffer(); b[midi]=await new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no)); }));
    puffer[id]=b; lade[id]='fertig'; }
  catch(e){ lade[id]='fehler'; toast('Klang konnte nicht geladen werden'); }
}
const stimmen=[null,null,null,null,null];
// Ein Ton klingt so lange, wie der SoundWhacker / die Taste gehalten wird (wie in Smart Control) – beim Vorspielen so lange wie die Note
function ton(fig, midi, wann, dauer){   // wann = ctx-Zeit (optional), dauer in Sekunden (optional)
  audio(); const B=puffer[st.klang]||puffer.marimba; if(!B){ ladeKlang(st.klang); return; }
  let best=null; for(const k in B){ const v=+k; if(best===null||Math.abs(v-midi)<Math.abs(best-midi)) best=v; }
  const t=Math.max(ctx.currentTime+.005, wann||0), src=ctx.createBufferSource(), g=ctx.createGain();
  src.buffer=B[best]; src.playbackRate.value=Math.pow(2,(midi-best)/12);
  const p=(KLAENGE[st.klang]||KLAENGE.marimba).pegel*.8; g.gain.setValueAtTime(p,t);
  src.connect(g); g.connect(dry); g.connect(wet._in); src.start(t);
  // alte Stimme dieser Figur sanft beenden
  const alt=stimmen[fig]; if(alt){ try{ alt.g.gain.setTargetAtTime(0,t,.06); alt.s.stop(t+.5); }catch(e){} }
  const v={s:src,g,t0:t}; stimmen[fig]=v; try{ src.stop(t+4); }catch(e){}
  if(dauer) aus(v,t+Math.max(.12,dauer));
  return v;
}
function aus(v,wann){ if(!v||v.los) return; v.los=true; const t=Math.max(wann||0,ctx.currentTime);
  try{ v.g.gain.setTargetAtTime(0,t,.07); v.s.stop(t+.6); }catch(e){} }
// Loslassen: mindestens 0,25 s klingen lassen, damit kurze Berührungen hörbar bleiben
function loslassen(fig){ const v=stimmen[fig]; if(v&&ctx) aus(v,Math.max(ctx.currentTime,v.t0+.25)); if(typeof recLos==='function'){ recLos(recIdx[fig]); recIdx[fig]=null; } }

// ---------- Lieder ----------
function eigene(){ try{ const l=JSON.parse(localStorage.getItem(LKEY)||'[]'); return Array.isArray(l)?l.filter(x=>x&&x.name&&x.noten):[]; }catch(e){ return []; } }
function eigeneSpeichern(l){ try{ localStorage.setItem(LKEY,JSON.stringify(l)); }catch(e){ toast('Speichern nicht möglich'); } }
// Lied → {titel, tempo, noten:[{m,dur}]}
function liedDaten(id){
  if(id.startsWith('lied:')&&window.HARFE){ const l=HARFE.LIEDER.find(x=>x.id===id.slice(5)); if(!l) return null;
    const p=HARFE.parse(l); const n=[]; p.noten.forEach(x=>{ if(x.midi===null){ if(n.length) n[n.length-1].pause=(n[n.length-1].pause||0)+x.dur; } else n.push({m:x.midi,dur:x.dur}); });
    n.forEach(x=>{ x.dur+=x.pause||0; delete x.pause; });
    // in den Klangbereich schieben (ganze Oktaven)
    const ms=n.map(x=>x.m); let s=0; while(Math.min(...ms)+s<55) s+=12; while(Math.max(...ms)+s>84) s-=12; n.forEach(x=>x.m+=s);
    return {titel:l.titel,tempo:l.tempo||100,noten:n}; }
  if(id.startsWith('eigen:')){ const l=eigene().find(x=>x.name===id.slice(6)); if(!l) return null; return {titel:l.name,tempo:60,noten:l.noten.map(x=>({m:x.m,dur:x.d,l:x.l}))}; }
  return null;
}
function toeneVon(noten){ return [...new Set(noten.map(x=>x.m))].sort((a,b)=>a-b); }
function liedListe(){
  const s=$('lied'); s.innerHTML='';
  // ⭐ = höchstens 5 Töne: jede Figur hat ihren eigenen Ton (Vorspielen nach Tonhöhe, „Feste SW-Töne“ möglich)
  const stern=(titel,d)=>(toeneVon(d.noten).length<=5?'⭐ ':'')+titel;
  const g1=document.createElement('optgroup'); g1.label='Lieder (⭐ = höchstens 5 Töne)';
  (window.HARFE?HARFE.LIEDER:[]).filter(l=>!l.eigen).forEach(l=>{ try{ const d=liedDaten('lied:'+l.id); if(d&&d.noten.length) g1.appendChild(new Option(stern(l.titel,d),'lied:'+l.id)); }catch(e){} });
  s.appendChild(g1);
  const e=eigene(); if(e.length){ const g2=document.createElement('optgroup'); g2.label='Meine Lieder'; e.forEach(l=>{ const d=liedDaten('eigen:'+l.name); g2.appendChild(new Option(d?stern(l.name,d):l.name,'eigen:'+l.name)); }); s.appendChild(g2); }
  if(![...s.options].some(o=>o.value===st.lied)) st.lied='lied:freude';
  s.value=st.lied;
}
let LIED=null, TOENE=[60,62,64,65,67], FIGTON=[60,62,64,65,67];
function liedSetzen(){
  stopp(); LIED=liedDaten(st.lied)||liedDaten('lied:freude');
  TOENE=toeneVon(LIED.noten);
  FIGTON=[0,1,2,3,4].map(i=>TOENE[i]!==undefined?TOENE[i]:null);
  pos=0; zug=0; spieler=[]; if(typeof spielartZeigen==='function') spielartZeigen(); bandBauen(); info();
}
const figVon=m=>TOENE.indexOf(m);
const fuenf=()=>TOENE.length<=5;
// Welche Figur spielt Ton Nr. k? ⭐-Lieder: nach Tonhöhe (tiefster = rot). Mehr als 5 Töne: reihum rot, orange, gelb, grün, blau …
const figFuer=k=>fuenf()?figVon(LIED.noten[k].m):k%5;

// ---------- Figuren ----------
const svg=$('svg');
const defs=el('defs',{},svg);
const flt=el('filter',{id:'gl',x:'-100%',y:'-100%',width:'300%',height:'300%'},defs); el('feGaussianBlur',{stdDeviation:14},flt);
el('ellipse',{cx:800,cy:880,rx:900,ry:120,fill:'#1c2a4d',opacity:.6},svg);
const ebene=el('g',{},svg);
const F=[];
for(let i=0;i<5;i++){
  const g=el('g',{},ebene), c=FARBE[i];
  const f={i,g,x:800,y:800,s:1,zx:800,zy:800,zs:1,hit:-9,live:false};
  el('ellipse',{cx:0,cy:4,rx:78,ry:16,fill:'rgba(0,0,0,.35)'},g);
  f.ring=el('ellipse',{cx:0,cy:4,rx:78,ry:16,fill:'none',stroke:c,'stroke-width':5,opacity:0},g);
  el('rect',{x:-40,y:-120,width:30,height:120,rx:12,fill:'#2a3350'},g); el('rect',{x:10,y:-120,width:30,height:120,rx:12,fill:'#2a3350'},g);
  el('rect',{x:-62,y:-275,width:124,height:170,rx:40,fill:c},g);
  el('rect',{x:-14,y:-292,width:28,height:26,fill:'#f2d4bd'},g);
  el('circle',{cx:0,cy:-338,r:54,fill:'#f2d4bd'},g);
  el('path',{d:'M-54,-346 C-54,-404 -14,-406 0,-406 C24,-406 56,-396 54,-346 C46,-372 22,-380 0,-380 C-24,-380 -46,-374 -54,-346Z',fill:['#5a3b2a','#2b2b2b','#8a5a2b','#3b2a20','#c9973f'][i]},g);
  el('circle',{cx:-19,cy:-340,r:6.5,fill:'#1b2a3a'},g); el('circle',{cx:19,cy:-340,r:6.5,fill:'#1b2a3a'},g);
  f.mund=el('path',{d:'M-18,-316 Q0,-302 18,-316',stroke:'#7a2d2d','stroke-width':5,fill:'none','stroke-linecap':'round'},g);
  // Whacker (vorne): weiße Röhre, unten schwarz
  // linker Arm (vom Betrachter aus rechts) hält unten am schwarzen Teil – hinter der Röhre
  el('path',{d:'M52,-250 Q100,-150 62,-80',stroke:c,'stroke-width':26,fill:'none','stroke-linecap':'round',style:'filter:brightness(.8)'},g);
  f.halo=el('rect',{x:4,y:-258,width:72,height:226,rx:30,fill:c,filter:'url(#gl)',opacity:0},g);
  f.rohr=el('rect',{x:20,y:-240,width:40,height:196,rx:14,fill:'#f4f3ef',stroke:'#c9c6bd','stroke-width':2},g);
  f.leucht=el('rect',{x:20,y:-240,width:40,height:136,rx:14,fill:c,opacity:0},g);
  el('rect',{x:19,y:-108,width:42,height:64,rx:10,fill:'#15161a'},g);

    f.arm.setAttribute('d','M-52,-250 Q'+(-94+60*e)+','+(-190-50*e)+' '+hx+','+hy); f.hand.setAttribute('cx',hx); f.hand.setAttribute('cy',hy);
